<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:210mm;height:297mm}
body{background:#0e0d12;color:#f4f2ee;font-family:"Noto Sans KR",sans-serif;position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.glow{position:absolute;width:260mm;height:260mm;border-radius:50%;right:-120mm;top:-110mm;background:radial-gradient(circle,rgba(124,92,255,.38),rgba(124,92,255,0) 62%)}
.glow2{position:absolute;width:220mm;height:220mm;border-radius:50%;left:-120mm;bottom:-120mm;background:radial-gradient(circle,rgba(124,92,255,.28),rgba(124,92,255,0) 62%)}
.p{position:absolute;inset:16mm 16mm 15mm}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{height:11mm}
.vol{display:flex;align-items:center;gap:3mm;font-family:Montserrat,sans-serif;font-weight:600;font-size:4mm;letter-spacing:.3em;color:#c3bfcc}
.vol i{display:block;width:16mm;height:9mm;border:.35mm solid rgba(244,242,238,.55);border-radius:2mm}
.eq{position:absolute;right:0;top:28mm;display:flex;align-items:flex-end;gap:1.8mm;height:16mm}
.eq b{display:block;width:1.4mm;border-radius:1mm;background:#b9a6ff}
.title{position:absolute;left:-1.5mm;top:50mm;font-family:Montserrat,sans-serif;font-weight:700;font-style:italic;line-height:.86;letter-spacing:-.035em}
.title .a{font-size:34mm;display:block}
.title .o{font-size:34mm;display:block;color:transparent;-webkit-text-stroke:.5mm #b9a6ff}
.kr{position:absolute;left:0;top:126mm;display:flex;align-items:baseline;gap:5mm}
.kr b{font-size:17mm;font-weight:900;letter-spacing:-.6mm}
.kr span{font-family:Montserrat,sans-serif;font-weight:600;font-size:4mm;letter-spacing:.32em;color:#b9a6ff}
.line{position:absolute;left:0;top:150mm;font-size:6mm;font-weight:500;color:#c3bfcc;line-height:1.6}
.line em{font-style:normal;color:#f4f2ee;font-weight:700}
.chk{position:absolute;left:0;right:0;top:176mm;display:flex;gap:3mm;font-family:Montserrat,sans-serif;font-weight:600;font-size:3.4mm;letter-spacing:.14em;color:#8f8a9c}
.chk span{display:flex;align-items:center;gap:1.8mm}
.chk i{display:block;width:4mm;height:4mm;border:.35mm solid #b9a6ff;border-radius:1mm}
.card{position:absolute;left:0;right:0;bottom:12mm;background:#f4f2ee;color:#16141c;border-radius:4mm;padding:6mm 8mm;display:grid;grid-template-columns:1fr 1fr;gap:4mm 8mm}
.f{display:flex;flex-direction:column;gap:2mm}
.f.w{grid-column:1/-1}
.f label{font-family:Montserrat,sans-serif;font-weight:700;font-size:3.2mm;letter-spacing:.24em;color:#6d4fe0}
.f label small{font-family:"Noto Sans KR";font-weight:500;letter-spacing:0;color:#8f8a9c;margin-left:2mm;font-size:3.2mm}
.f u{display:block;height:8mm;border-bottom:.4mm solid #16141c;text-decoration:none;font-size:5mm;display:flex;align-items:flex-end;padding-bottom:1mm;color:#8f8a9c;gap:12mm}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-family:Montserrat,sans-serif;font-weight:500;font-size:3.1mm;letter-spacing:.28em;color:#8f8a9c}
</style></head><body><div class="glow"></div><div class="glow2"></div>
<div class="p">
<div class="top"><img src="raw-logo.png"><div class="vol">VOL.<i></i></div></div>
<div class="eq"><b style="height:35%;opacity:.5"></b><b style="height:70%;opacity:.7"></b><b style="height:100%"></b><b style="height:55%;opacity:.8"></b><b style="height:85%;opacity:.9"></b><b style="height:40%;opacity:.6"></b><b style="height:65%;opacity:.8"></b><b style="height:25%;opacity:.5"></b></div>
<div class="title"><span class="a">PRACTICE</span><span class="o">JOURNAL</span></div>
<div class="kr"><b>연습일지</b><span>RAW DANCE STUDIO SUWON</span></div>
<div class="line">오늘 연습한 한 줄이 쌓여서<br><em>다음 무대의 내가 된다.</em></div>
<div class="chk"><span><i></i>CLASS</span><span><i></i>FEEDBACK</span><span><i></i>PRACTICE</span><span><i></i>TOMORROW</span></div>
<div class="card">
<div class="f"><label>NAME<small>이름</small></label><u></u></div>
<div class="f"><label>CLASS<small>반</small></label><u></u></div>
<div class="f w"><label>MY GOAL<small>이번 일지가 끝날 때까지 이루고 싶은 것</small></label><u></u></div>
<div class="f w"><label>PERIOD<small>기간</small></label><u><span>20&nbsp;&nbsp;&nbsp;&nbsp;.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;~&nbsp;&nbsp;&nbsp;&nbsp;20&nbsp;&nbsp;&nbsp;&nbsp;.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;.</span></u></div>
</div>
<div class="foot"><span>@RAWDANCE_SUWON</span><span>KEEP DANCING</span></div>
</div></body></html>
