<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;900&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px}
body{font-family:"Noto Sans KR",sans-serif;background:#0e0d12;color:#f4f2ee;position:relative;overflow:hidden}
.glow{position:absolute;width:1100px;height:1100px;border-radius:50%;left:-420px;bottom:-560px;background:radial-gradient(circle,rgba(124,92,255,.32),rgba(124,92,255,0) 62%)}
.p{position:absolute;inset:0 76px;display:flex;flex-direction:column}
.top{height:146px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #2a2832;padding-bottom:27px}
.logo{height:40px;display:block}

.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:10px}
.kick{font-size:50px;font-weight:300;letter-spacing:-1px}
.big{margin-top:14px;font-weight:900;font-size:318px;line-height:.98;letter-spacing:-18px;position:relative;left:-12px}
.big .a{color:#b9a6ff;position:relative;left:14px}
.meta{margin-top:58px;display:flex;align-items:center;gap:22px;font-size:30px;font-weight:400;letter-spacing:-.5px}
.meta i{display:block;width:60px;height:2px;background:#b9a6ff}
.meta span{color:#a6a1b2}
.bot{height:110px;border-top:1px solid #2a2832;display:flex;justify-content:space-between;align-items:flex-start;padding-top:24px;font-family:Montserrat,sans-serif;font-size:18px;letter-spacing:.2em;margin-bottom:0}
.bot .h{color:#8f8a9c;font-weight:500}.bot .s{font-weight:600}
</style></head><body><div class="glow"></div><div class="p">
<div class="top"><img class="logo" src="raw-logo.png"><div class="en">SUWON<br>2028 ADMISSION</div></div>
<div class="mid">
<div class="kick">예고 · 대학</div>
<div class="big">입시반<br><span class="a">모집</span></div>
<div class="meta"><i></i>2028학년도 입시 대비 <span>현 중2 · 고2</span><i></i></div>
</div>
<div class="bot"><span class="h">@RAWDANCE_SUWON</span><span class="s">SWIPE →</span></div>
</div></body></html>
