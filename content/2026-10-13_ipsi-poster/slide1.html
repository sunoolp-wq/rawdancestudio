<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Montserrat:wght@200;300;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px}
body{font-family:"Noto Sans KR",sans-serif;background:#0e0d12;color:#f4f2ee;position:relative;overflow:hidden}
.glow{position:absolute;width:1100px;height:1100px;border-radius:50%;left:-420px;bottom:-560px;background:radial-gradient(circle,rgba(124,92,255,.32),rgba(124,92,255,0) 62%)}
.p{position:absolute;inset:72px 76px 64px}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:22px;border-bottom:1px solid rgba(244,242,238,.16)}
.top img{height:46px}
.top .r{font-family:Montserrat;font-weight:500;font-size:15px;letter-spacing:5px;color:#8f8c96;text-align:right;line-height:1.7}

.kick{margin-top:110px;font-size:52px;font-weight:300;letter-spacing:-1px}
.kick b{font-weight:700}
.big{margin-top:18px;font-weight:900;font-size:322px;line-height:.98;letter-spacing:-20px;margin-left:-12px}
.big .o{color:transparent;-webkit-text-stroke:3px #f4f2ee}
.big .a{color:#b9a6ff}
.meta{margin-top:56px;display:flex;align-items:center;gap:20px;font-size:30px;font-weight:400;letter-spacing:-0.5px}
.meta i{display:block;width:60px;height:1.5px;background:#b9a6ff}
.meta span{color:#8f8c96}
.bot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding-top:22px;border-top:1px solid rgba(244,242,238,.16);font-family:Montserrat;font-weight:500;font-size:18px;letter-spacing:3px;color:#8f8c96}
.bot b{color:#f4f2ee;font-weight:600}
</style></head><body><div class="glow"></div><div class="p"><div class="top"><img src="raw-logo.png"><div class="r">SUWON<br>2028 ADMISSION</div></div>
<div class="kick">예고 · 대학</div>
<div class="big">입시반<br><span class="a">모집</span></div>
<div class="meta"><i></i>2028학년도 입시 대비<span>현 중2 · 고2</span></div>
<div class="bot"><span>@RAWDANCE_SUWON</span><b>SWIPE →</b></div>
</div></body></html>
