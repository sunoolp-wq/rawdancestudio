function toast(m){ toastEl.textContent=m; toastEl.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>toastEl.classList.remove("on"),1800); }

function fallbackCopy(text){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){} ta.remove(); return ok;
}
function copyText(text, i){
  const fin=ok=>{ if(ok){ mark(i); toast("복사했어요. 블로그에 붙여넣으세요"); } else toast("복사가 막혀 있어요. 글자를 길게 눌러 직접 복사해 주세요"); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>fin(true)).catch(()=>fin(fallbackCopy(text))); }
  else fin(fallbackCopy(text));
}
function copyImage(src, i){
  try{
    const item=new ClipboardItem({"image/png": fetch(src).then(r=>r.blob()).then(b=>new Blob([b],{type:"image/png"}))});
    navigator.clipboard.write([item]).then(()=>{ mark(i); toast("이미지를 복사했어요. 블로그에 붙여넣으세요"); })
      .catch(()=>toast("이미지 복사가 막혀 있어요. 이미지를 길게 눌러(PC는 우클릭) 저장해 주세요"));
  }catch(e){ toast("이미지 복사가 막혀 있어요. 이미지를 길게 눌러(PC는 우클릭) 저장해 주세요"); }
}
function mark(i){ done.add(i); save(); render(); }
function toggle(i){ done.has(i)?done.delete(i):done.add(i); save(); render(); }

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const list=document.getElementById("list"); list.innerHTML="";
  list.style.cssText="display:flex;flex-direction:column;gap:14px";
  B.forEach((b,i)=>{
    const d=document.createElement("section"); d.className="blk"+(done.has(i)?" done":"");
    const [tg,cls]=TAG[b.t]; const isDone=done.has(i);
    let btn="";
    if(b.t==="card") btn=`<button class="main" data-img="${b.src}">${isDone?"✓ 복사함":"이미지 복사"}</button>`;
    else if(b.t==="imgs") btn=`<button class="ghost" data-tg>${isDone?"✓ 넣음":"넣었어요"}</button>`;
    else if(b.t==="photo" && b.input) btn=`<button class="ghost" data-tg>${isDone?"✓ 넣음":"넣었어요"}</button>`;
    else if(b.text) btn=`<button class="main" data-copy>${isDone?"✓ 복사함":(b.t==="photo"?"설명 복사":"복사")}</button>`;
    else btn=`<button class="ghost" data-tg>${isDone?"✓ 넣음":"넣었어요"}</button>`;
    let body="";
    if(b.t==="card") body=`<div class="imgs card"><figure><img src="${b.src}" alt="${esc(b.lab)}" loading="lazy"></figure></div>`;
    else if(b.t==="imgs") body=`<div class="imgs">${b.srcs.map((s,k)=>`<figure><img src="${s}" alt="${k?"B":"A"}홀 10월 시간표" loading="lazy"><button class="ghost" data-img="${s}">${k?"B":"A"}홀 이미지 복사</button></figure>`).join("")}</div>`;
    else if(b.t==="photo") body=`<div class="ph"><b>${b.have?"보유 영상":"찍을 것"}: ${esc(b.what)}</b>${b.input?"":`<span class="note">사진 아래 설명 →</span><pre>${esc(b.text)}</pre>`}</div>`;
    else if(b.t==="table") body=`<div class="tbl"><table>${b.rows.map((r,k)=>`<tr>${r.map(c=>k?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join("")}</tr>`).join("")}</table></div>`;
    else if(b.text) body=`<pre>${esc(b.text)}</pre>`;
    const note=b.note?`<p class="note">${esc(b.note)}</p>`:"";
    d.innerHTML=`<div class="top"><span class="num">${i+1}</span><span class="tag ${cls}">${b.have?"보유":tg}</span><span class="lab">${esc(b.lab)}</span>${btn}</div>${body}${note}`;
    d.querySelectorAll("[data-img]").forEach(x=>x.onclick=()=>copyImage(x.dataset.img,i));
    const c=d.querySelector("[data-copy]"); if(c) c.onclick=()=>copyText(b.text,i);
    const g=d.querySelector("[data-tg]"); if(g) g.onclick=()=>toggle(i);
    if(b.t==="table"){ const tb=document.createElement("button"); tb.className="ghost"; tb.textContent="표 내용 복사"; tb.onclick=()=>copyText(b.rows.map(r=>r.join("\t")).join("\n"),i); d.querySelector(".top").appendChild(tb); }
    list.appendChild(d);
  });
  const ck=document.createElement("div"); ck.className="ck";
  ck.innerHTML=`<span>마지막 확인: 대표 사진 지정 · 장소(지도) 첨부 · 인스타·유튜브 링크 카드 · A·B홀 시간표</span><button class="ghost" id="reset" style="align-self:flex-start">체크 모두 지우기</button>`;
  list.appendChild(ck);
  document.getElementById("reset").onclick=()=>{ done.clear(); save(); render(); };
  document.getElementById("prog").textContent=`${done.size} / ${B.length} 완료`;
}
render();
</script>
