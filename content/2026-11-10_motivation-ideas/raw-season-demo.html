<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{color-scheme:dark;padding:0!important}html,body{width:100%;height:100%;background:#0e0d12;overflow:hidden}
body{color:#f4f2ee;font-family:Montserrat,"Noto Sans KR",sans-serif}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;background:#0e0d12}
.g{position:absolute;border-radius:50%;pointer-events:none}
#g1{width:1100px;height:1100px;right:-420px;top:-600px;background:radial-gradient(circle,rgba(124,92,255,.38),rgba(124,92,255,0) 62%)}
#g2{width:900px;height:900px;left:-420px;bottom:-600px;background:radial-gradient(circle,rgba(124,92,255,.22),rgba(124,92,255,0) 62%)}
.hd{position:absolute;left:40px;right:40px;top:28px;display:flex;align-items:flex-end;justify-content:space-between}
.hd .l{display:flex;align-items:flex-end;gap:20px}
.hd img{height:34px;margin-bottom:6px}
#sn{font-weight:900;font-style:italic;font-size:54px;line-height:.86;letter-spacing:-.03em}
#sn span{color:transparent;-webkit-text-stroke:2px #b9a6ff}
#sn small{font-style:normal;font-size:15px;letter-spacing:.3em;color:#b9a6ff;margin-left:14px;vertical-align:8px;font-weight:800}
.hd .r{text-align:right}
#nx{font-weight:900;font-style:italic;font-size:34px;line-height:.9;color:#b9a6ff}
#per{margin-top:7px;font-weight:600;font-size:13px;letter-spacing:.24em;color:#8f8a9c;margin-right:-.24em}
.rule{position:absolute;left:40px;right:40px;top:104px;height:1px;background:#2f2c38}
/* 순위 */
#list{position:absolute;left:40px;top:120px;width:842px}
.cap{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px;letter-spacing:.32em;color:#b9a6ff;margin-bottom:9px}
.cap i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#b9a6ff;box-shadow:0 0 14px #b9a6ff;margin-right:10px;vertical-align:1px}
.cap em{font-style:normal;letter-spacing:.06em;color:#6f6a7c;font-family:"Noto Sans KR";font-weight:500;font-size:13px}
.row{display:grid;grid-template-columns:52px 150px 118px 1fr 62px 84px;align-items:center;height:52px;padding:0 16px;margin-bottom:5px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);cursor:pointer;transition:transform .08s}
.row:active{transform:scale(.985);background:rgba(185,166,255,.16)}
.row.top{background:linear-gradient(90deg,rgba(185,166,255,.17),rgba(185,166,255,.03));border-color:rgba(185,166,255,.3)}
.rk{font-weight:900;font-style:italic;font-size:24px;color:#6f6a7c}.row.top .rk{color:#f4f2ee}
.nm{font-family:"Noto Sans KR";font-weight:900;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{justify-self:start;font-family:"Noto Sans KR";font-weight:700;font-size:13px;padding:5px 10px;border-radius:20px;white-space:nowrap}
.p-on{background:rgba(245,190,70,.14);color:#f5be46}.p-off{background:rgba(255,255,255,.06);color:#8f8a9c}.p-sh{background:rgba(127,209,255,.13);color:#7fd1ff}.p-wait{background:rgba(185,166,255,.13);color:#b9a6ff}
.fr{display:flex;gap:6px;align-items:center}
.fr b{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.f-ok{background:#f5be46;color:#0e0d12}.f-sh{background:#7fd1ff;color:#0e0d12}.f-miss{background:rgba(255,90,90,.16);color:#ff7a7a;border:1.5px solid rgba(255,90,90,.5)}
.f-up{border:1.5px solid #34303f}.f-today{border:2px dashed #b9a6ff;animation:bl 1.4s ease-in-out infinite}
@keyframes bl{50%{opacity:.35}}
.st{font-weight:900;font-size:20px;color:#f5be46;text-align:right}.st.off{color:#4a4655}
.pt{font-weight:900;font-size:22px;text-align:right}.pt small{font-weight:600;font-size:11px;color:#8f8a9c;margin-left:3px}
/* 오른쪽 */
#side{position:absolute;left:906px;right:40px;top:120px}
.card{border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);padding:16px 18px;margin-bottom:12px}
.now{display:flex;justify-content:space-between;align-items:center;height:34px;font-family:"Noto Sans KR";font-weight:900;font-size:18px}
.now span{font-family:Montserrat;font-weight:700;font-size:14px;color:#8f8a9c}
.now i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5ce08a;box-shadow:0 0 10px #5ce08a;margin-right:9px;vertical-align:2px;animation:bl 1.6s infinite}
.empty{font-family:"Noto Sans KR";font-size:14px;color:#6f6a7c;padding:6px 0}
#port{display:flex;align-items:baseline;gap:8px}
#port b{font-weight:900;font-style:italic;font-size:52px;line-height:1;color:#f5be46}
#port span{font-weight:800;font-size:20px;color:#8f8a9c}
#portn{margin-top:8px;font-family:"Noto Sans KR";font-size:13px;line-height:1.6;color:#8f8a9c}
.rl{font-family:"Noto Sans KR";font-size:12.5px;line-height:1.7;color:#8f8a9c}.rl b{color:#f4f2ee}
.lg{display:flex;gap:12px;margin-top:6px;font-family:"Noto Sans KR";font-size:12px;color:#8f8a9c;align-items:center}
.lg b{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#hint{position:absolute;left:0;right:0;bottom:0;height:50px;background:#b9a6ff;color:#0e0d12;display:flex;align-items:center;justify-content:center;gap:14px;font-family:"Noto Sans KR";font-weight:900;font-size:19px}
#hint small{font-family:Montserrat;font-weight:700;font-size:12px;letter-spacing:.2em;opacity:.6}
/* 출석 창 */
#ov{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(8,7,12,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:9}
#ov.on{display:flex}
.box{width:560px;border-radius:24px;background:#16141c;border:1px solid rgba(185,166,255,.25);padding:30px 34px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.box h2{font-family:"Noto Sans KR";font-weight:900;font-size:34px}
.box p{margin-top:6px;font-family:"Noto Sans KR";font-size:15px;color:#8f8a9c}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.acts button.main{grid-column:1 / -1}
.acts button,.pad button,.x{font-family:"Noto Sans KR";font-weight:900;border:0;border-radius:16px;cursor:pointer}
.acts button{height:84px;font-size:22px;background:rgba(255,255,255,.06);color:#f4f2ee;border:1px solid rgba(255,255,255,.1)}
.acts button:active,.pad button:active{transform:scale(.96)}
.acts button.main{background:#b9a6ff;color:#0e0d12;border:0}
.acts button small{display:block;font-family:Montserrat;font-weight:600;font-size:12px;letter-spacing:.1em;opacity:.6;margin-top:3px}
.dots{display:flex;gap:16px;justify-content:center;margin:20px 0 16px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid #6f6a7c}.dots i.f{background:#b9a6ff;border-color:#b9a6ff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:330px;margin:0 auto}
.pad button{height:62px;font-family:Montserrat;font-size:26px;background:rgba(255,255,255,.06);color:#f4f2ee}
.mine{margin-top:16px;max-height:330px;overflow:auto;text-align:left;border:1px solid rgba(255,255,255,.08);border-radius:14px}
.mh{display:flex;justify-content:space-between;padding:10px 16px;font-family:"Noto Sans KR";font-weight:700;font-size:14px;color:#8f8a9c;border-bottom:1px solid rgba(255,255,255,.06)}.mh b{color:#f5be46;font-family:Montserrat}
.mr{display:flex;gap:12px;align-items:center;padding:9px 16px;font-family:"Noto Sans KR";font-size:15px;border-bottom:1px solid rgba(255,255,255,.04)}
.mr span{color:#8f8a9c;font-size:13px;width:92px;flex:none}.mr em{font-style:normal;font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(185,166,255,.14);color:#b9a6ff;flex:none}
.mr b{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mr i{font-style:normal;font-family:Montserrat;font-weight:800;color:#f5be46;flex:none}
.x{margin-top:18px;height:46px;width:160px;font-size:16px;background:transparent;color:#8f8a9c;border:1px solid #34303f!important}
.res{font-size:76px;line-height:1}
.res+h2{margin-top:12px}
.shake{animation:sk .35s}@keyframes sk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.fade{animation:fd .5s ease both}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── 움직임: 촤라락 등장 · 점수 반짝 · 대기화면 ── */
.row{position:relative}
.row.in{animation:sIn .6s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i) * 60ms)}
@keyframes sIn{0%{opacity:0;transform:translateX(90px) skewX(-10deg)}60%{opacity:1;transform:translateX(-6px) skewX(2deg)}100%{opacity:1;transform:none}}
.row.in .fr b{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 60ms + 260ms + var(--d) * 45ms)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.row.hit{animation:hit 2.2s ease-out}
@keyframes hit{0%,30%{box-shadow:0 0 0 2px #f5be46,0 0 34px rgba(245,190,70,.55);background:rgba(245,190,70,.16)}100%{box-shadow:none}}
.plus{position:absolute;right:20px;top:-6px;font-weight:900;font-style:italic;font-size:26px;color:#f5be46;text-shadow:0 0 16px rgba(245,190,70,.6);animation:up 1.8s ease-out forwards;pointer-events:none}
@keyframes up{0%{opacity:0;transform:translateY(16px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-34px)}}
.st:not(.off){display:inline-block;animation:fl 1.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes fl{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.07) rotate(-2deg)}}
#att{position:absolute;top:0;right:0;bottom:0;left:0;z-index:8;background:#0e0d12;display:none;overflow:hidden}
#att.on{display:block}
#att .bg1{position:absolute;width:1400px;height:1400px;border-radius:50%;left:-300px;top:-700px;background:radial-gradient(circle,rgba(124,92,255,.45),rgba(124,92,255,0) 60%);animation:drift 14s ease-in-out infinite alternate}
#att .bg2{position:absolute;width:1100px;height:1100px;border-radius:50%;right:-420px;bottom:-640px;background:radial-gradient(circle,rgba(245,190,70,.16),rgba(245,190,70,0) 60%);animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(160px,90px)}}
#sc{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;justify-content:center;padding:0 90px}
#att .bar{position:absolute;left:0;bottom:0;height:5px;background:#b9a6ff;animation:bar linear forwards}
@keyframes bar{from{width:0}to{width:100%}}
#att .tap{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-family:"Noto Sans KR";font-weight:700;font-size:17px;color:#8f8a9c;letter-spacing:.04em;animation:bl 2s infinite}
.a-k{font-weight:800;font-size:18px;letter-spacing:.42em;color:#b9a6ff}
.a-big{font-weight:900;font-style:italic;font-size:132px;line-height:.9;letter-spacing:-.04em;white-space:nowrap}
.a-big .o{color:transparent;-webkit-text-stroke:3px #b9a6ff}
.a-mid{font-family:"Noto Sans KR";font-weight:900;font-size:64px;line-height:1.1}
.a-sub{font-family:"Noto Sans KR";font-weight:500;font-size:24px;color:#c3bfcc;margin-top:18px}
.a-gold{color:#f5be46}
.slam{animation:slam .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{0%{opacity:0;transform:scale(1.9) skewX(-8deg)}100%{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.9,.25,1) both}
@keyframes rise{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:none}}
.swipe{animation:swp .6s cubic-bezier(.2,.9,.25,1) both}
@keyframes swp{0%{opacity:0;transform:translateX(-120px) skewX(12deg)}100%{opacity:1;transform:none}}
.pod{display:flex;gap:26px;align-items:flex-end;margin-top:34px}
.pod>div{flex:1;border-radius:20px;padding:26px 28px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.pod>div.p1{background:linear-gradient(160deg,rgba(245,190,70,.22),rgba(245,190,70,.04));border-color:rgba(245,190,70,.5);padding-top:46px}
.pod .r{font-weight:900;font-style:italic;font-size:64px;line-height:1;color:transparent;-webkit-text-stroke:2px #b9a6ff}
.pod .p1 .r{-webkit-text-stroke:2px #f5be46}
.pod .n{font-family:"Noto Sans KR";font-weight:900;font-size:44px;margin-top:10px}
.pod .v{font-weight:900;font-size:34px;color:#f5be46;margin-top:4px}
.feed{margin-top:26px;display:grid;gap:12px}
.feed div{display:flex;gap:22px;align-items:center;font-family:"Noto Sans KR";font-size:30px;font-weight:700}
.feed b{font-family:Montserrat;font-weight:800;font-size:22px;color:#8f8a9c;width:80px}
.feed em{font-style:normal;font-size:20px;padding:5px 14px;border-radius:20px;background:rgba(185,166,255,.14);color:#b9a6ff}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.chips span{font-family:"Noto Sans KR";font-weight:900;font-size:28px;padding:10px 22px;border-radius:40px;background:rgba(245,190,70,.14);color:#f5be46}
.conf{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none}.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;opacity:.85;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(860px) rotate(540deg)}}
.tapbig{font-weight:900;font-style:italic;font-size:140px;line-height:.9;letter-spacing:-.03em;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04);text-shadow:0 0 50px rgba(185,166,255,.6)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}

const tz_ = () => SpreadsheetApp.getActive().getSpreadsheetTimeZone();
const fmt_ = (d, f) => Utilities.formatDate(d, tz_(), f || 'yyyy-MM-dd HH:mm:ss');
const P_ = x => Date.parse(String(x).replace(' ', 'T')); // 시트 시간대 글자끼리 비교 (스크립트 시간대와 무관)
const DAYS_ = ['일', '월', '화', '수', '목', '금', '토'];
const PRO_ = /전문반|PRO/;
// 출석 포인트 제외 수업: [설정] '출석 제외 수업'에 쉼표로 (기본 K-POP, 원장님 2026-11-10)
const skip_ = (name, skip) => String(skip || '').split(',').map(x => x.trim()).filter(Boolean).some(x => String(name).indexOf(x) >= 0);
const hm_ = v => { const m = /(\d{1,2}):(\d{2})/.exec(String(v)); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const hhmm_ = n => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
const mins_ = s => (+String(s).slice(11, 13)) * 60 + (+String(s).slice(14, 16));
// 날짜 글자 계산 (스크립트 시간대와 무관하게 UTC로)
const addDays_ = (s, n) => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const dow_ = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
const base_ = note => String(note || '').replace(' (지각)', '').trim(); // 'HH:MM 수업명'
// 그날 수업 [{s, e, label: 'HH:MM 수업명', range, teacher}]. 태블릿 화면(Board.html)에도 같은 계산이 있음
function classesOn_(tt, dateS, skip) {
  const day = DAYS_[dow_(dateS)];
  return tt.slice(1).filter(r => String(r[0]).trim().charAt(0) === day && hm_(r[1]) != null && hm_(r[2]) != null && !skip_(r[3], skip))
    .map(r => ({ s: hm_(r[1]), e: hm_(r[2]), label: `${hhmm_(hm_(r[1]))} ${String(r[3]).trim()}`, range: `${hhmm_(hm_(r[1]))}~${hhmm_(hm_(r[2]))} ${String(r[3]).trim()}`, teacher: String(r[4] || '').trim() }));
}
// 연습 분 = 시작~끝에서 수업 시간과 겹치는 분을 뺀 것 (같은 날)
function pracMin_(tt, startS, endS, skip) {
  const a = mins_(startS), b = mins_(endS);
  const over = classesOn_(tt, String(startS).slice(0, 10), skip).reduce((t, c) => t + Math.max(0, Math.min(b, c.e) - Math.max(a, c.s)), 0);

}
// 지금 출석: open = 시작 before분 전~시작 after분 후 (정상), late = 그 뒤~수업 끝 (지각), next = 다음 수업
function classesAt_(tt, nowS, before, after, skip) {
  const list = classesOn_(tt, nowS.slice(0, 10), skip), m = mins_(nowS);
  return { all: list, open: list.filter(c => m >= c.s - before && m <= c.s + after), late: list.filter(c => m > c.s + after && m <= c.e),
    next: list.filter(c => c.s - before > m).sort((a, b) => a.s - b.s)[0] || null };
}
function read_(name) {
  const sh = SpreadsheetApp.getActive().getSheetByName(name);
  if (!sh) return [];
  return sh.getDataRange().getValues().map(r => r.map(c => c instanceof Date ? fmt_(c) : c));
}
function cfg_() {

const num_ = (v, d) => v === '' || v == null || isNaN(+v) ? d : +v;
// 오늘 개인연습 세션들 (연습 시작 → 연습 끝 '개인연습') 분 합계
function pracToday_(rows, tt, skip) {
  let open = null, sum = 0;
  rows.forEach(x => { if (x.k === '연습 시작') open = x; else if (x.k === '연습 끝' && open) { if (x.note !== '월말평가 준비') sum += pracMin_(tt, open.t, x.t, skip).min; open = null; } });
  return sum;
}

// 태블릿 화면이 1분마다·기록 직후 부름 (학생 비밀번호·원장님 비밀번호는 보내지 않음)
function getData() {

  const cfg = read_(TAB.cfg).filter(r => String(r[0]).trim().indexOf(MASTER_KEY) !== 0 && String(r[0]).trim().indexOf('요약 메일') !== 0);

// 태블릿에서 누르면 기록 한 줄. note = 수업 출석: 'HH:MM 수업명' / 연습 끝: '개인연습' | '월말평가 준비' / 운동 완료·연습일지: 'yyyy-MM-dd'
function checkIn(name, pin, kind, note) {
  const lock = LockService.getScriptLock(); lock.waitLock(10000);
  try {
    if (KINDS.indexOf(kind) < 0) return { ok: false, msg: '알 수 없는 버튼이에요' };
    const row = read_(TAB.stu).slice(1).find(r => String(r[0]).trim() === name);
    if (!row) return { ok: false, msg: '명단에 없는 이름이에요' };
    if (String(row[3] || '').indexOf('휴원') >= 0) return { ok: false, msg: '휴원 중인 학생이에요' };
    const g = cfg_(), master = String(g(MASTER_KEY) || '').trim(), isMaster = master.length >= 4 && String(pin).trim() === master;
    // 학생 비밀번호 5번 틀리면 5분 잠금 (친구 번호 맞히기 방지). 원장님 비밀번호는 잠금 없음
    const cache = CacheService.getScriptCache(), ck = 'pinfail_' + name, fails = +(cache.get(ck) || 0);
    if (!isMaster) {
      if (fails >= 5) return { ok: false, msg: '비밀번호를 5번 틀려서 5분 동안 잠겼어요' };
      if (String(row[1]).trim().padStart(4, '0') !== String(pin).trim().padStart(4, '0')) { cache.put(ck, String(fails + 1), 300); return { ok: false, msg: '비밀번호가 달라요' }; }
      cache.remove(ck);
    }
    const now = new Date(), nowS = fmt_(now), today = nowS.slice(0, 10);
    const S = String(g('시즌 시작')).slice(0, 10), E = String(g('시즌 끝')).slice(0, 10);
    if (S && today < S) return { ok: false, msg: `시즌은 ${S}부터 시작해요` };
    if (E && today > E) return { ok: false, msg: '시즌이 끝났어요. 다음 시즌을 기다려 주세요!' };
    const holi = String(g('휴강일') || '').match(/\d{4}-\d{2}-\d{2}/g) || [], isHoli = holi.indexOf(today) >= 0;
    const TT = isHoli ? [[]] : read_(TAB.tt), skipS = g('출석 제외 수업') === '' ? 'K-POP' : g('출석 제외 수업');
    const mine = read_(TAB.log).slice(1).filter(r => String(r[1]).trim() === name && String(r[0]).slice(0, 10) === today)
      .map(r => ({ t: String(r[0]), k: String(r[2]).trim(), note: String(r[3] || '').trim() }));
    const lastT = k => { const a = mine.filter(x => x.k === k); return a.length ? a[a.length - 1].t : ''; };
    const openS = (a, b) => lastT(a) > lastT(b); // 시작만 있고 끝이 없음
    let late = false;
    if (kind === '수업 출석') {
      const w = classesAt_(TT, nowS, num_(g('출석: 시작 몇 분 전부터'), 20), num_(g('출석: 시작 후 몇 분까지'), 15), skipS);
      let c = null;
      if (isMaster) c = w.all.find(x => x.label === note) || null;
      else {
        c = w.open.find(x => x.label === note) || w.late.find(x => x.label === note) || null;
        if (!c && w.open.length + w.late.length === 1) c = w.open[0] || w.late[0];
        if (!c && !w.open.length && !w.late.length) return { ok: false, msg: (isHoli ? '오늘은 휴강일이에요' : '지금은 수업 출석 시간이 아니에요') + (w.next ? ` · 다음 ${w.next.label}` : '') };
        late = !!c && w.late.indexOf(c) >= 0;
      }
      if (!c) return { ok: false, msg: '어느 수업인지 골라 주세요' };
      const cls = mine.filter(x => x.k === '수업 출석');
      if (cls.some(x => base_(x.note) === c.label)) return { ok: false, msg: `${c.label} 출석은 이미 했어요` };
      if (cls.length >= 3) return { ok: false, msg: '수업 출석은 하루 3번까지예요' };
      note = c.label + (late ? ' (지각)' : '');
    }
    if (DAILY.indexOf(kind) >= 0) {
      const yest = fmt_(new Date(now.getTime() - 864e5), 'yyyy-MM-dd');
      if (note !== today && note !== yest) return { ok: false, msg: '오늘이나 어제만 고를 수 있어요' };
      const dup = read_(TAB.log).slice(1).some(r => String(r[1]).trim() === name && String(r[2]).trim() === kind && String(r[3]).slice(0, 10) === note);
      if (dup) return { ok: false, msg: `${note === today ? '오늘' : '어제'} ${kind}는 이미 체크했어요` };
    }
    if (kind === '연습 시작' && openS('연습 시작', '연습 끝')) return { ok: false, msg: '이미 연습 중이에요. 끝나면 [연습 끝]' };
    if (kind === '연습 시작' && !isMaster) {
      const m = mins_(nowS), c = classesOn_(TT, today, skipS).find(c => m >= c.s && m < c.e);
      if (c) return { ok: false, msg: `수업 시간에는 연습을 시작할 수 없어요 · ${c.range}` };
    }
    if (kind === '연습 끝' && !openS('연습 시작', '연습 끝')) return { ok: false, msg: '[연습 시작]을 먼저 눌러야 해요' };
    if (kind === '연습 끝' && PRAC_TYPES.indexOf(note) < 0) return { ok: false, msg: '개인연습인지 월말평가 준비인지 골라 주세요' };
    SpreadsheetApp.getActive().getSheetByName(TAB.log).appendRow([nowS, name, kind, note || '', isMaster ? '원장님 처리' : '']);
    let msg = '';
    if (kind === '연습 끝') {
      const pm = pracMin_(TT, lastT('연습 시작'), nowS, skipS), need = num_(g('연습 인정 최소 분'), 30);
      const ex = pm.over ? ` (수업 시간 ${pm.over}분 제외)` : '';
      if (note === '월말평가 준비') msg = `월말평가 준비 ${pm.min}분 기록${ex} · 점수 없음`;
      else { const sum = pracToday_(mine.concat([{ t: nowS, k: '연습 끝', note }]), TT, skipS);
        msg = `개인연습 ${pm.min}분${ex} · 오늘 합계 ${sum}분` + (sum >= need ? ' 🔥 인정!' : ` · ${need}분부터 인정`); }
    }
    if (DAILY.indexOf(kind) >= 0) msg = `${note === today ? '오늘' : '어제'} ${kind} ✓ · 단톡방에 인증 올려 주세요`;
    if (kind === '수업 출석') msg = note + (late ? ' · 점수 절반, 🔥는 유지' : '');
    if (isMaster) msg = '원장님 처리 · ' + msg;
    return { ok: true, name, kind, time: nowS.slice(11, 16), msg };
  } finally { lock.releaseLock(); }
}

// 태블릿 화면이 계산한 순위를 [순위] 탭에 저장 (바뀌었을 때만). 원장님이 시트에서 바로 보고, 주간 리포트에도 씀
function saveBoard(json) {
  const rows = JSON.parse(json), key = Utilities.base64Encode(Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, json, Utilities.Charset.UTF_8));
  const props = PropertiesService.getScriptProperties();
  if (props.getProperty('boardHash') === key) return false;
  const ss = SpreadsheetApp.getActive(); let sh = ss.getSheetByName(TAB.rank);
  if (!sh) sh = ss.insertSheet(TAB.rank);
  sh.clearContents();
  const head = ['순위', '이름', '점수', '🔥 연속(주)', '상태', '금요일 도장', '장르 수업', '개인연습(일)', '운동(일)', '연습일지(일)'];
  sh.getRange(1, 1, 1, head.length).setValues([head]).setFontWeight('bold');
  if (rows.length) sh.getRange(2, 1, rows.length, head.length).setValues(rows.map(r => head.map((h, i) => r[i] == null ? '' : r[i])));
  sh.getRange(rows.length + 3, 1).setValue('업데이트 ' + fmt_(new Date()) + ' (태블릿 화면 기준)');

// 매주 일요일 20시 (트리거) 또는 시트 메뉴 → [리포트] 탭에 이번 주 학생별 학부모 문자 문구

  const total = stu.length, out = [];
  stu.forEach(r => {
    const n = String(r[0]).trim(), mine = log.filter(x => x.n === n);
    const cls = mine.filter(x => x.k === '수업 출석'), genre = cls.filter(x => !PRO_.test(x.note) && x.note).length;
    const proRow = fri ? cls.find(x => x.d === fri && (PRO_.test(x.note) || !x.note)) : null;
    const shield = fri && String(r[2] || '').indexOf(fri) >= 0;
    const friS = !fri ? '-' : holi.indexOf(fri) >= 0 ? '휴강' : fri > today ? '예정' : proRow ? (proRow.note.indexOf('지각') >= 0 ? '지각 출석' : '출석') : shield ? '보호권 사용' : '결석';
    const days = [...new Set(mine.map(x => x.d))];
    const prac = days.filter(d => pracToday_(mine.filter(x => x.d === d), TT, skipS) >= need).length;
    const ex = new Set(mine.filter(x => x.k === '운동 완료').map(x => x.note.slice(0, 10))).size;

  const head = ['이름', '금요일 전문반', '장르 수업', '개인연습(일)', '운동(일)', '연습일지(일)', '이번 주 체크 합계', '시즌 순위', '점수', '학부모 문자 (복사해서 보내기)'];

}

// 매일 23시 (트리거) 또는 시트 메뉴 → 원장님께 오늘 요약 메일 (원장님 2026-11-11 D2)

      document.getElementById('cx').onclick = close; bindMaster(); return; }
    if (cands.length === 1 && !cands[0].lt) { note = cands[0].label; return askPin(k); }
    box().innerHTML = `<h2>${esc(sel)}</h2><p>${cands.some(c => c.lt) ? '지각 출석은 점수 절반, 🔥는 그대로예요' : '어느 수업이에요?'}</p><div class="acts">${cands.map(c => `<button data-v="${esc(c.label)}"${c.lt ? ' style="border-color:#f5be46"' : ''}>${esc(c.label.slice(6))}${c.lt ? ' <span style="color:#f5be46">지각</span>' : ''}<small>${esc(c.label.slice(0, 5))} · ${esc(c.teacher)}</small></button>`).join('')}</div><button class="x" id="cx">닫기</button>`;
    box().querySelectorAll('[data-v]').forEach(b => b.onclick = () => { note = b.dataset.v; askPin(k); }); document.getElementById('cx').onclick = close; return;
  }
  if (!opts) return askPin(k);
  box().innerHTML = `<h2>${esc(sel)}</h2><p>${esc(k)}</p><div class="acts">${opts.map(([v, l, sub]) => `<button data-v="${v}">${l}<small>${sub}</small></button>`).join('')}</div><button class="x" id="cx">닫기</button>`;
  box().querySelectorAll('[data-v]').forEach(b => b.onclick = () => { note = b.dataset.v; askPin(k); }); document.getElementById('cx').onclick = close;
}
function askPin(k, master) {
  kind = k; pin = ''; idle();
  box().innerHTML = `<h2>${esc(sel)}</h2><p>${esc(k)}${note ? ' · ' + esc(DAILY.includes(k) ? (note === C.today ? '오늘' : '어제') : note) : ''} · ${master ? '원장님 비밀번호' : '비밀번호 4자리'}</p><div class="dots" id="dots">${'<i></i>'.repeat(4)}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '←', 0, '✕'].map(x => `<button data-p="${x}">${x}</button>`).join('')}</div>`;
  box().querySelectorAll('[data-p]').forEach(b => b.onclick = () => press(b.dataset.p));
}
function press(x) {
  idle(); if (x === '✕') return close(); if (x === '←') pin = pin.slice(0, -1); else if (pin.length < 4) pin += x;
  document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('f', i < pin.length));
  if (pin.length === 4) { box().querySelector('.pad').style.opacity = .4; send(); }
}
// 체크 효과음 (원장님 2026-11-11 D6): 성공 '띵동', 실패 '삑'. 화면을 누른 뒤에만 소리 남
let AC = null; addEventListener('pointerdown', () => { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} });
function beep(ok) { try { if (!AC) return; const t = AC.currentTime, notes = ok ? [[988, 0], [1319, .12]] : [[196, 0], [185, .14]];
  notes.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = ok ? 'sine' : 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(ok ? .35 : .12, t + d + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + (ok ? .32 : .2));
    o.connect(g).connect(AC.destination); o.start(t + d); o.stop(t + d + .35); }); } catch (e) {} }
function send() {
  const done = r => {
    beep(!!r.ok);
    if (!r.ok && r.msg === '비밀번호가 달라요') { box().classList.add('shake'); setTimeout(() => box().classList.remove('shake'), 400); pin = '';
      document.querySelector('#box p').textContent = '비밀번호가 달라요. 다시 입력해요'; box().querySelector('.pad').style.opacity = 1;
      document.querySelectorAll('#dots i').forEach(d => d.classList.remove('f')); return; }
    box().innerHTML = r.ok ? `<div class="res">✅</div><h2>${esc(r.name)} · ${esc(r.kind)}</h2><p style="font-size:20px;color:#f4f2ee;margin-top:10px">${r.time}${r.msg ? ' · ' + esc(r.msg) : ''}</p>`
      : `<div class="res">⚠️</div><h2>${esc(r.msg)}</h2>`;
    clearTimeout(timer); timer = setTimeout(() => { close(); load(); }, r.ok ? 2600 : 3200);
  };
  API.checkIn(sel, pin, kind, note, done);
}


// ── 대기화면: 아무도 안 누르면 장면이 슉슉 넘어감 ──
const IDLE_MS = 45000, SCENE_MS = 5500;
const mono = () => performance.now(); // 대기화면·새로 읽기 타이머는 기기 시계가 바뀌어도 영향 없게
let lastTouch = mono(), attOn = false, aTimer = null;
const att = () => document.getElementById('att');
// 시즌 끝(시즌 끝 날짜 다음 날부터): 최종 결과 장면만 (원장님 2026-11-10)
function finalScenes() {
  const L = C.list, w = L.filter(s => s.rank === 1), top = L.slice(0, 3), m = C.name.match(/^(.*?)(\d+)$/);
  const conf = Array.from({ length: 36 }, (_, i) => `<i style="left:${(i * 37) % 100}%;background:${['#f5be46', '#b9a6ff', '#7fd1ff', '#f4f2ee'][i % 4]};animation-delay:${(i % 9) * .35}s;animation-duration:${3 + (i % 5) * .6}s"></i>`).join('');
  return [
    `<div class="conf">${conf}</div><div class="a-k swipe">${esc(C.name)} · FINAL · ${md(C.S)} — ${md(C.E)}</div><div class="a-mid slam" style="margin-top:16px;font-size:44px;color:#c3bfcc;animation-delay:.1s">🏆 시즌 1등</div>
     <div class="a-big slam a-gold" style="margin-top:10px;animation-delay:.35s;font-family:'Noto Sans KR';font-style:normal">${w.map(s => esc(s.name)).join(' · ')}</div>
     <div class="a-mid rise" style="margin-top:22px;animation-delay:.6s;font-family:Montserrat;font-style:italic"><span class="cu" data-to="${w.length ? w[0].pts : 0}">0</span>P</div>
     <div class="a-sub rise" style="animation-delay:.85s">🎬 개인 포트폴리오 영상 촬영 확정! 축하해요</div>`,
    `<div class="a-k swipe">FINAL TOP 3</div><div class="pod">${[top[1], top[0], top[2]].filter(Boolean).map((s, i) => `
     <div class="${s === top[0] ? 'p1' : ''} rise" style="animation-delay:${[.35, .1, .55][i]}s"><div class="r">${String(s.rank).padStart(2, '0')}</div><div class="n">${esc(s.name)}</div><div class="v"><span class="cu" data-to="${s.pts}">0</span>P</div></div>`).join('')}</div>`,
    `<div class="a-k swipe">THANK YOU</div><div class="a-big slam" style="margin-top:18px">${m ? esc(m[1]) + '<span class="o">' + m[2] + '</span>' : esc(C.name)}</div><div class="a-mid rise" style="margin-top:26px;animation-delay:.45s">모두 수고했어요 👏</div><div class="a-sub rise" style="animation-delay:.7s">다음 시즌에서 다시 만나요</div>`];
}
function scenes() {
  if (C.today > C.E) return finalScenes();
  const L = C.list, top = L.slice(0, 3), mx = Math.max(0, ...L.map(s => s.streak));
  const kings = L.filter(s => s.streak === mx && mx > 0).map(s => s.name);
  const dd = C.nextF ? Math.round((D(C.nextF) - D(C.today)) / 864e5) : null;
  const m = C.name.match(/^(.*?)(\d+)$/);
  const out = [];
  out.push(`<div class="a-k swipe">PRO 전문반 · ${md(C.S)} — ${md(C.E)}</div><div class="a-big slam" style="margin-top:18px;animation-delay:.12s">${m ? esc(m[1]) + '<span class="o">' + m[2] + '</span>' : esc(C.name)}</div>
    <div class="a-mid rise a-gold" style="margin-top:26px;animation-delay:.45s;font-family:Montserrat;font-style:italic">${dd === 0 ? 'TODAY ' + esc(C.FT) : dd != null ? 'NEXT CLASS D-' + dd : 'SEASON END'}</div>`);
  if (top.length) out.push(`<div class="a-k swipe">SEASON TOP 3</div><div class="pod">${[top[1], top[0], top[2]].filter(Boolean).map((s, i) => `
    <div class="${s === top[0] ? 'p1' : ''} rise" style="animation-delay:${[.35, .1, .55][i]}s"><div class="r">${String(s.rank).padStart(2, '0')}</div><div class="n">${esc(s.name)}</div><div class="v"><span class="cu" data-to="${s.pts}">0</span>P</div></div>`).join('')}</div>`);
  if (kings.length) out.push(`<div class="a-k swipe">🔥 STREAK KING</div><div class="a-big slam" style="margin-top:18px;animation-delay:.1s"><span class="cu" data-to="${mx}">0</span>주 <span class="o">연속</span></div>
    <div class="a-mid rise" style="margin-top:26px;animation-delay:.5s">${kings.map(esc).join(' · ')}</div><div class="a-sub rise" style="animation-delay:.7s">금요일 전문반 수업을 한 번도 안 빠졌어요</div>`);
  out.push(`<div class="a-k swipe">TODAY · ${md(C.today)}</div><div class="a-mid slam" style="margin-top:14px;animation-delay:.1s">오늘 체크인</div>` + (C.feed.length
    ? `<div class="feed">${C.feed.map((x, i) => `<div class="swipe" style="animation-delay:${.3 + i * .12}s"><b>${x.t.slice(11, 16)}</b>${esc(x.n)}<em>${esc(x.k === '연습 끝' ? (x.note || '연습') : x.k)}</em></div>`).join('')}</div>`
    : `<div class="a-sub rise" style="animation-delay:.4s">아직 아무도 없어요. 오늘 첫 번째 체크인 주인공은?</div>`));
  if (L.length) { const w = L.filter(s => s.rank === 1), gap = w[0].pts - ((L.find(s => s.rank > 1) || { pts: w[0].pts }).pts);
    out.push(`<div class="a-k swipe">🎬 포트폴리오 영상 촬영권 · 시즌 1등 단 한 명</div><div class="a-mid slam" style="margin-top:16px;font-size:44px;color:#c3bfcc;animation-delay:.1s">지금 1등</div>
    <div class="a-big slam" style="margin-top:10px;animation-delay:.35s;font-family:'Noto Sans KR';font-style:normal">${w.map(s => esc(s.name)).join(' · ')}</div>
    <div class="a-mid rise a-gold" style="margin-top:22px;animation-delay:.6s;font-family:Montserrat;font-style:italic"><span class="cu" data-to="${w[0].pts}">0</span>P</div>
    <div class="a-sub rise" style="animation-delay:.85s">${w.length > 1 ? '완전 동점! 한 번만 더 오면 단독 1등' : (L.find(s => s.rank > 1) ? lead(w[0], L.find(s => s.rank > 1)) + ' · 아직 뒤집을 수 있어요' : '')} · ${md(C.E)} 마감</div>`); }
  out.push(`<div class="a-k swipe">RAW SEASON</div><div class="tapbig slam" style="margin-top:20px">TAP YOUR<br>NAME 👆</div><div class="a-sub rise" style="animation-delay:.4s">내 이름을 눌러서 출석 · 연습 · 운동 · 연습일지 체크</div>`);
  return out;
}
function playAttract(i) {
  if (!attOn) return; const list = scenes();
  if (i >= list.length) { stopAttract(true); return; }
  const sc = document.getElementById('sc'); sc.innerHTML = list[i];
  sc.querySelectorAll('.cu').forEach(el => countUp(el, +el.dataset.to));
  const bar = document.getElementById('abar'); bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = `bar ${SCENE_MS}ms linear forwards`;
  aTimer = setTimeout(() => playAttract(i + 1), SCENE_MS);
}
function startAttract() { if (attOn || !C || ov().classList.contains('on')) return; attOn = true; att().classList.add('on'); playAttract(0); }
function stopAttract(cycleDone) {
  clearTimeout(aTimer); if (!attOn) return; attOn = false; att().classList.remove('on'); render(true);
  if (cycleDone) lastTouch = mono() - IDLE_MS + 25000; // 순위표 25초 보여 주고 다시 대기화면
}
addEventListener('pointerdown', () => { lastTouch = mono(); if (attOn) stopAttract(false); }, true);
setInterval(() => { if (!attOn && mono() - lastTouch > IDLE_MS) startAttract(); }, 1000);

// ── 데이터 ──
const API = window.google && google.script && google.script.run ? {
  get: cb => google.script.run.withSuccessHandler(s => { net(true); cb(JSON.parse(s)); }).withFailureHandler(() => net(false)).getData(),
  save: j => google.script.run.withFailureHandler(() => {}).saveBoard(j),
  checkIn: (n, p, k, note, cb) => google.script.run.withSuccessHandler(cb).withFailureHandler(e => cb({ ok: false, msg: '연결 오류, 다시 눌러 주세요' })).checkIn(n, p, k, note)
} : window.MOCK;
function net(ok) { const el = document.getElementById('net'); if (el) el.style.display = ok ? 'none' : 'block'; if (!ok) setTimeout(load, 15000); }
let first = true, fetchedAt = Date.now(), lastLoad = 0;
function load() { lastLoad = mono(); if (API) API.get(d => { DATA = d; fetchedAt = Date.now(); render(first); first = false; }); }
// 새로 읽기: 운영 시간(12~24시) 1분마다, 밤·오전 10분마다 (구글 사용량 아끼기)
load(); setInterval(() => { const h = new Date().getHours(); if (mono() - lastLoad >= (h >= 12 ? 60000 : 600000) - 500) load(); }, 30000);
</script>
