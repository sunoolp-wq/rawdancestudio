<title>RAW 온라인 연습실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;1,900&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* 한 화면 3D 학원: 원장님 배치도(2026-11-12) 그대로 · 위 알약(지금 있는 곳·소리·학원 정보) + 아래 동작 바 + 근처 행동 버튼 */
:root{
  --bg:#0e0d12; --fg:#f4f2ee; --mute:#a7a2b5; --acc:#b9a6ff; --gold:#f5be46;
  --glass:rgba(22,20,30,.62); --line:rgba(255,255,255,.14);
  --disp:Montserrat,"Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.pill{pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;padding:5px 6px}
.pill b{font-family:var(--disp);font-weight:800;font-size:14px;padding:0 8px 0 6px;white-space:nowrap}
.pill b span{color:var(--acc);font-size:12px;margin-left:4px}
.ib{border:0;background:transparent;color:var(--fg);font:inherit;font-size:13px;font-weight:700;padding:7px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.ib:hover,.ib:focus-visible{background:rgba(255,255,255,.1);outline:none}
.ib.on{background:var(--acc);color:#0e0d12}
.hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:0;right:0;text-align:center;font-size:12px;color:var(--mute);pointer-events:none;z-index:4;text-shadow:0 1px 6px #000}
.counter{position:fixed;top:calc(env(safe-area-inset-top,0px) + 86px);left:0;right:0;text-align:center;pointer-events:none;z-index:4}
.counter span{display:inline-block;font-size:12px;font-weight:700;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.counter em{font-style:normal;font-family:var(--disp);font-weight:800;color:var(--gold)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:2px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:6px;z-index:5;max-width:calc(100% - 24px)}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--fg);font:inherit;font-size:12px;font-weight:700;width:64px;padding:7px 0 6px;border-radius:16px;cursor:pointer}
.act i{font-style:normal;font-size:21px;line-height:1}
.act:hover,.act:focus-visible{background:rgba(255,255,255,.08);outline:none}
.act.on{background:rgba(185,166,255,.22)}
.ctx{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:5;border:0;border-radius:999px;background:var(--fg);color:#0e0d12;font:inherit;font-weight:900;font-size:15px;padding:11px 20px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ctx:focus-visible{outline:3px solid var(--acc)}
.side{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 92px);display:flex;flex-direction:column;gap:8px;z-index:5}
.side .ib{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px;padding:9px 12px}
.count{position:fixed;left:0;right:0;top:34%;text-align:center;font-family:var(--disp);font-weight:900;font-style:italic;font-size:88px;color:var(--fg);text-shadow:0 0 30px rgba(185,166,255,.9);pointer-events:none;z-index:4;opacity:0}
.count.pop{animation:pop .5s ease-out}
@keyframes pop{0%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(1)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 132px);max-width:calc(100vw - 32px);text-align:center;line-height:1.4;transform:translateX(-50%);background:var(--fg);color:#0e0d12;font-weight:900;font-size:14px;padding:10px 18px;border-radius:18px;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;width:max-content}
.toast.on{opacity:1}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(6,5,10,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:8;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:380px;background:#17151f;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card h2{margin:0;font-size:20px;font-weight:900;text-wrap:balance}
.card p{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--mute)}
.card .row{display:grid;gap:8px;margin-top:16px}
.card .opt{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);font:inherit;border-radius:14px;padding:12px 14px;cursor:pointer}
.card .opt:hover,.card .opt:focus-visible{border-color:var(--acc);outline:none}
.card .opt i{font-style:normal;font-size:22px}
.card .opt b{display:block;font-size:15px}
.card .opt small{display:block;font-size:12px;color:var(--mute)}
.card .opt[disabled]{opacity:.45;cursor:default}
.card textarea{width:100%;box-sizing:border-box;margin-top:14px;background:#0e0d12;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;resize:none;height:84px}
.card textarea:focus{outline:2px solid var(--acc)}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:900;font-size:15px;cursor:pointer}
.pri{background:var(--acc);color:#0e0d12}.sec{background:rgba(255,255,255,.08);color:var(--fg)}
.card img{width:100%;border-radius:14px;margin-top:12px;display:block;-webkit-user-select:auto;user-select:auto}
.info{margin-top:14px;display:grid;gap:8px;font-size:14px}
.info div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.info span{color:var(--mute);flex:none}
.info b{text-align:right;-webkit-user-select:text;user-select:text}
.info a{color:var(--acc)}
.badge{display:inline-block;font-family:var(--disp);font-size:11px;font-weight:800;letter-spacing:.14em;color:#0e0d12;background:var(--gold);border-radius:6px;padding:3px 8px;margin-bottom:10px}
@media (max-width:420px){.act{width:56px;font-size:11px}.act i{font-size:19px}.pill b{font-size:13px}.count{font-size:72px}}
@media (prefers-reduced-motion:reduce){.count.pop{animation:none;opacity:0}}
</style>
<canvas id="c" tabindex="0" aria-label="RAW 학원 3D 화면. 바닥을 누르면 캐릭터가 이동해요"></canvas>
<div class="top">
  <div class="pill"><b id="room">로비 <span>RAW 수원</span></b></div>

</div>

  <button class="ib" id="note" type="button">📝 쪽지</button>
  <button class="ib" id="water" type="button">💧 물</button>

</div>

</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const today = new Date().toISOString().slice(0, 10);

// ── 원장님 배치도 좌표(px) → 미터. 약 23m × 14.4m (100평) ──
const S = .02, PX = x => (x - 630) * S, PZ = y => (y - 417.5) * S, H = 3.2;
const ROOMS = {
  A: { x1: 55, y1: 58, x2: 282, y2: 420, name: 'A홀', sub: '메인홀', door: [282, 380], inn: [250, 380], out: [318, 380], hall: true },
  C: { x1: 55, y1: 422, x2: 282, y2: 657, name: 'C홀', sub: '전문반 연습실', door: [282, 465], locked: true },
  B: { x1: 967, y1: 60, x2: 1130, y2: 492, name: 'B홀', sub: '메인홀', door: [1017, 492], inn: [1017, 462], out: [1017, 528], hall: true },
  STORE: { x1: 282, y1: 58, x2: 333, y2: 193, block: '짐 놓는 데예요. 앞에서 [🎒 옷 바꾸기]를 눌러 보세요' },
  LOCK: { x1: 480, y1: 58, x2: 686, y2: 178, block: '탈의실이에요' },
  BOSS: { x1: 686, y1: 58, x2: 967, y2: 178, block: '원장실이에요' },
  WC1: { x1: 741, y1: 632, x2: 987, y2: 777, block: '여자 화장실이에요' }, WC2: { x1: 987, y1: 632, x2: 1205, y2: 777, block: '남자 화장실이에요' },
};
const inR = (r, x, y) => x > r.x1 && x < r.x2 && y > r.y1 && y < r.y2;
function roomAt(x, y) { if (x < 55 || x > 1205 || y < 58 || y > 777) return 'OUT'; for (const k in ROOMS) if (inR(ROOMS[k], x, y)) return k; return 'L'; }

// ── 장면 ──
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0c0b10); scene.fog = new THREE.Fog(0x0c0b10, 22, 40);
const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 120);
scene.add(new THREE.HemisphereLight(0xdcd6ff, 0x16141c, 0.45));
const sun = new THREE.DirectionalLight(0xffffff, 0.3); sun.position.set(-4, 12, 8); scene.add(sun);
const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .8, metalness: 0 }, o));
const box = (w, h, d, m, x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); scene.add(b); return b; };
function rectFloor(r, m, y = 0) { const f = new THREE.Mesh(new THREE.PlaneGeometry((r.x2 - r.x1) * S, (r.y2 - r.y1) * S), m); f.rotation.x = -Math.PI / 2; f.position.set(PX((r.x1 + r.x2) / 2), y, PZ((r.y1 + r.y2) / 2)); scene.add(f); return f; }

// 바닥: 로비 = 광택 밝은 회색 타일, 홀 = 밝은 회색 콘크리트
const lobbyFloor = rectFloor({ x1: 55, y1: 58, x2: 1205, y2: 777 }, mat(0x8d8c93, { roughness: .22, metalness: .15 }));
const tile = new THREE.GridHelper(23, 38, 0x6f6e76, 0x6f6e76); tile.position.set(PX(630), .003, PZ(417.5)); tile.scale.z = 14.4 / 23; tile.material.transparent = true; tile.material.opacity = .25; scene.add(tile);
const concrete = mat(0x7b7a80, { roughness: .6 });
['A', 'B', 'C'].forEach(k => rectFloor(ROOMS[k], concrete, .006));
rectFloor({ x1: 405, y1: 690, x2: 485, y2: 770 }, mat(0x111014, { roughness: .9 }), .007); // 입구 매트
const floors = [lobbyFloor];

// 벽 (문 자리는 비워 둠)
const walls = [];
const wallLobby = mat(0x4b4a52, { roughness: .7 }), wallHall = mat(0x16151a, { roughness: .85 });
function wall(x1, y1, x2, y2, m = wallLobby, h = H) { const len = Math.hypot(x2 - x1, y2 - y1) * S, mm = m.clone(); mm.transparent = true;
  const w = new THREE.Mesh(new THREE.BoxGeometry(x1 === x2 ? .14 : len, h, x1 === x2 ? len : .14), mm); w.position.set(PX((x1 + x2) / 2), h / 2, PZ((y1 + y2) / 2)); scene.add(w); walls.push(w); return w; }
// 바깥 벽
wall(55, 58, 1205, 58); wall(55, 58, 55, 777); wall(1205, 58, 1205, 777); wall(55, 777, 388, 777); wall(500, 777, 1205, 777);
// A·C홀
wall(282, 58, 282, 350, wallHall); wall(282, 410, 282, 420, wallHall); wall(55, 421, 282, 421, wallHall);
wall(282, 422, 282, 440, wallHall); wall(282, 490, 282, 657, wallHall); wall(55, 657, 282, 657, wallHall);
// 짐 놓는 데, 탈의실, 원장실
wall(333, 58, 333, 193); wall(480, 58, 480, 72); wall(480, 106, 480, 128); wall(480, 162, 480, 178); wall(480, 117, 686, 117); wall(480, 178, 890, 178); wall(945, 178, 967, 178); wall(686, 58, 686, 178);
// B홀
wall(967, 60, 967, 492, wallHall); wall(1130, 60, 1130, 492, wallHall); wall(967, 492, 990, 492, wallHall); wall(1045, 492, 1130, 492, wallHall);
// 화장실
wall(741, 632, 930, 632); wall(965, 632, 1015, 632); wall(1050, 632, 1205, 632); wall(741, 632, 741, 777); wall(987, 632, 987, 777);
// 문 표시 (색 띠)
function doorMark(x, y, vertical, c, label) { const d = new THREE.Mesh(new THREE.PlaneGeometry(vertical ? .14 : 1.0, vertical ? 1.0 : .14), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: .55 }));
  d.rotation.x = -Math.PI / 2; d.position.set(PX(x), .01, PZ(y)); scene.add(d); }
doorMark(282, 380, true, 0xb9a6ff); doorMark(282, 465, true, 0x5fd0ff); doorMark(1017, 492, false, 0xb9a6ff); doorMark(444, 777, false, 0x5fd0ff);
// C홀 잠긴 문 (유리문 느낌 + 자물쇠 표)
const cDoor = box(.06, 2.2, 1.0, mat(0x5fd0ff, { transparent: true, opacity: .25, roughness: .1 }), PX(282), 1.1, PZ(465)); walls.push(cDoor);
// 원장실 유리문
const bossDoor = box(1.1, 2.2, .05, mat(0xbfe6ff, { transparent: true, opacity: .25, roughness: .1 }), PX(917), 1.1, PZ(178)); walls.push(bossDoor);
// 자동문 (유리)
const autoDoorL = box(1.1, 2.4, .05, mat(0xbfe6ff, { transparent: true, opacity: .2, roughness: .05 }), PX(416), 1.2, PZ(777)), autoDoorR = autoDoorL.clone(); autoDoorR.position.x = PX(472); scene.add(autoDoorR);

// 글자 텍스처
function tex(draw, w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); draw(g, w, h); const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; return t; }
const logos = [];
function rawLogo(kind) { return tex((g, w, h) => { g.clearRect(0, 0, w, h); g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = 'italic 900 210px Montserrat, sans-serif';
  if (kind === 'led') { g.shadowColor = '#fff'; g.shadowBlur = 46; g.fillStyle = '#fff'; for (let i = 0; i < 3; i++) g.fillText('RAW', w / 2, h / 2); g.shadowBlur = 0; g.fillStyle = '#141318'; g.fillText('RAW', w / 2, h / 2); }
  else if (kind === 'panel') { g.fillStyle = '#121116'; g.fillRect(0, 0, w, h); g.shadowColor = '#fff'; g.shadowBlur = 30; g.fillStyle = '#fff'; g.fillText('RAW', w / 2, h / 2 - 10); g.shadowBlur = 0; g.font = '700 30px Montserrat'; g.fillText('RAW  DANCE  STUDIO', w / 2, h - 46); }
  else { g.fillStyle = 'rgba(232,230,236,.92)'; g.fillText('RAW', w / 2, h / 2); } }, 1024, 320); }
function logoAt(kind, x, y, z, ry, wdt) { const m = new THREE.Mesh(new THREE.PlaneGeometry(wdt, wdt * 320 / 1024), new THREE.MeshBasicMaterial({ map: rawLogo(kind), transparent: true }));
  m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); logos.push([m, kind]); return m; }
// A홀: 문 쪽 벽(안쪽) LED 간판 + 위쪽 벽 큰 스티커 / C홀: 위쪽 벽 스티커 / B홀: 왼쪽 벽 LED / 로비: 인포 벽 큰 판넬
logoAt('led', PX(282) - .09, 2.2, PZ(200), -Math.PI / 2, 2.6);
logoAt('sticker', PX(168), 2.0, PZ(58) + .09, 0, 3.6);
logoAt('sticker', PX(168), 2.0, PZ(421) + .09, 0, 3.0);
logoAt('led', PX(967) + .09, 2.2, PZ(270), Math.PI / 2, 2.6);
logoAt('panel', PX(620), 1.95, PZ(178) + .09, 0, 2.4);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => logos.forEach(([m, k]) => { m.material.map = rawLogo(k); m.material.needsUpdate = true; }));
function label(text, x, z, ry = 0, y = 2.65, c = '#c3bfcc') { const m = new THREE.Mesh(new THREE.PlaneGeometry(1.6, .4), new THREE.MeshBasicMaterial({ transparent: true, map: tex((g, w, h) => { g.fillStyle = c; g.font = '700 46px "Noto Sans KR", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2); }, 400, 100) }));
  m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); return m; }
label('A홀', PX(282) + .09, PZ(380), Math.PI / 2, 2.6, '#b9a6ff'); label('🔒 C홀 · PRO', PX(282) + .09, PZ(465), Math.PI / 2, 2.6, '#5fd0ff'); label('B홀', PX(1017), PZ(492) + .09, 0, 2.6, '#b9a6ff');
label('원장실', PX(830), PZ(178) + .09, 0, 2.7); label('탈의실', PX(480) - .09, PZ(117), -Math.PI / 2, 2.7); label('여자 화장실', PX(860), PZ(632) - .09, Math.PI, 2.7); label('남자 화장실', PX(1100), PZ(632) - .09, Math.PI, 2.7);

// 인포데스크 (곡선 카운터) · 흰 소파 · 정수기 · 짐 선반
const obstacles = [];
const desk = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.2, 1.05, 48, 1, true, -0.55, 1.1), mat(0x5d5c64, { roughness: .35, metalness: .2, side: THREE.DoubleSide }));
desk.position.set(PX(656), .525, PZ(258) - 3.6); scene.add(desk);
const deskTop = new THREE.Mesh(new THREE.CylinderGeometry(4.25, 4.25, .05, 48, 1, false, -0.55, 1.1), mat(0xe9e8ee, { roughness: .3 })); deskTop.position.set(PX(656), 1.07, PZ(258) - 3.6); scene.add(deskTop);
obstacles.push({ x1: 545, y1: 200, x2: 767, y2: 290 });

  if (!act) { body.position.y = 1 + Math.sin(t * 2.2) * .015; armL.rotation.z = -.08; armR.rotation.z = .08; headG.rotation.z = Math.sin(t * 1.1) * .05; return; }
  actT += dt; const p = actT / DUR[act];
  const beatPos = beatOn && AC ? (AC.currentTime - beatStart) / BEAT : actT / BEAT, bp = beatPos - Math.floor(beatPos), bounce = Math.pow(1 - bp, 3);
  if (act === 'sit') { body.position.y = .62; legL.rotation.x = -1.45; legR.rotation.x = -1.45; armL.rotation.x = -.5; armR.rotation.x = -.5; headG.rotation.z = Math.sin(t) * .06; return; }
  if (act === 'drink') { armR.rotation.x = -2.2; armR.rotation.z = -.3; headG.rotation.x = -.35 * Math.sin(Math.min(1, p * 2) * Math.PI / 2); }

  if (act === 'eight' || act === 'free') { const n = Math.min(8, Math.floor(actT / BEAT) + 1); if (n !== lastCount) { lastCount = n; showCount(n); if (act === 'free' && n === 5) sparkle(); }
    body.position.y = 1 - bounce * .12; legL.rotation.z = .12 + bounce * .08; legR.rotation.z = -.12 - bounce * .08;
    if (act === 'eight') { const s = n % 2 ? 1 : -1; armL.rotation.z = -.4 - (n % 4 < 2 ? 1.6 : .4) * (1 - bp * .3); armR.rotation.z = .4 + (n % 4 < 2 ? .4 : 1.6) * (1 - bp * .3); body.rotation.y = s * .25; headG.rotation.z = s * .12; if (n >= 7) body.rotation.y = (actT % (2 * BEAT)) / (2 * BEAT) * Math.PI * 2; }
    else { const m = freeMoves[n - 1], k = Math.sin(bp * Math.PI);
      if (m === 0) { armL.rotation.z = -1.4 + Math.sin(t * 8) * .5; armR.rotation.z = 1.4 + Math.sin(t * 8 + 1.5) * .5; }
      if (m === 1) { body.rotation.y = bp * Math.PI * 2; armL.rotation.z = -1.2; armR.rotation.z = 1.2; }
      if (m === 2) { armR.rotation.x = -2.6; armR.rotation.z = .3; body.rotation.z = -.15; }
      if (m === 3) { body.position.y = 1 + k * .45; legL.rotation.x = -k * .8; legR.rotation.x = -k * .8; armL.rotation.z = -2.6; armR.rotation.z = 2.6; }
      if (m === 4) { body.position.y = .82; legL.rotation.x = -.6; legR.rotation.x = .2; armL.rotation.x = -1.2; armR.rotation.x = -1.2; headG.rotation.x = .25; } } }
  if (act === 'clap') { const c = Math.abs(Math.sin(beatPos * Math.PI)); armL.rotation.x = -1.35; armR.rotation.x = -1.35; armL.rotation.z = -.25 - c * .55; armR.rotation.z = .25 + c * .55; body.position.y = 1 - bounce * .06;
    const n = Math.floor(actT / BEAT); if (n !== lastCount) { lastCount = n; if (AC) drum('clap', AC.currentTime); if (n % 2) sparkle(); } }
  if (actT >= DUR[act]) finishAct(act);
}

// ── 지금 있는 곳 · 근처에서 할 수 있는 것 ──
let curRoom = 'L', ctxFn = null;
const POI = [
  { x: 932, y: 361, r: 90, label: '🛋 소파에 앉기', fn: () => { me.position.copy(toV(882, 361)); me.rotation.y = -Math.PI / 2; startAct('sit'); toast('잠깐 쉬어 가요'); } },
  { x: 1189, y: 609, r: 80, label: '💧 정수기 물 마시기', fn: () => { me.rotation.y = Math.PI / 2; startAct('drink'); } },
  { x: 307, y: 215, r: 70, label: '🎒 옷 바꾸기', fn: () => { hoodI = (hoodI + 1) % HOODS.length; hoodM.color.setHex(HOODS[hoodI]); store.set('raw_hoodi', hoodI); sparkle(); toast('후드 색을 바꿨어요'); } },
  { x: 917, y: 205, r: 70, label: '✊ 원장실 노크', fn: () => { if (ac()) [0, .18, .36].forEach(d => drum('knock', AC.currentTime + d)); toast('똑똑똑… 원장님은 수업 중이에요'); } },
  { x: 312, y: 465, r: 70, label: '🔒 C홀 (전문반 전용)', fn: () => toast('C홀은 전문반 친구들만 들어갈 수 있어요') },
  { x: 656, y: 330, r: 90, label: '💁 인포데스크 문의', fn: () => $('info').click() },
  { x: 444, y: 745, r: 70, label: '🚪 학원 나가기', fn: () => toast('또 놀러 와요! 진짜 연습실은 [RAW 수원] 버튼에') },
];
function updateRoom() { const [x, y] = toPx(me.position), r = roomAt(x, y);
  if (r !== curRoom) { curRoom = r; const R = ROOMS[r]; $('room').innerHTML = R && R.hall ? `${R.name} <span>${R.sub}</span>` : '로비 <span>RAW 수원</span>';
    $('light').hidden = !(R && R.hall); Object.entries(mirrors).forEach(([k, m]) => { if (m.real) m.m.visible = k === r; });
    if (R && R.hall) toast(`${R.name} 입장! 거울 보면서 춰 봐요 · 🎨 조명도 바꿀 수 있어요`); }
  let near = null; if (!act || act === 'sit') for (const p of POI) if (Math.hypot(p.x - x, p.y - y) < p.r) { near = p; break; }
  if (near && !path.length) { $('ctx').hidden = false; $('ctx').textContent = near.label; ctxFn = near.fn; } else { $('ctx').hidden = true; ctxFn = null; } }
$('ctx').onclick = () => { ac(); if (ctxFn) ctxFn(); };
$('light').onclick = () => { const h = halls[curRoom]; if (!h) return; setHall(curRoom, (h.ci + 1) % LED.length); toast(`${ROOMS[curRoom].name} 조명 · ${LEDN[halls[curRoom].ci]}`); };

// ── 루프 ──
const fadeRay = new THREE.Raycaster(); let prev = performance.now(), autoT = 0;
function loop(now) { const dt = Math.min(.05, (now - prev) / 1000); prev = now; const t = now / 1000;
  pose(dt, t); updateRoom();
  focus.lerp(new THREE.Vector3(me.position.x, 1.2, me.position.z), Math.min(1, dt * 5));
  camera.position.set(focus.x + Math.sin(yaw) * Math.cos(pitch) * dist, focus.y + Math.sin(pitch) * dist, focus.z + Math.cos(yaw) * Math.cos(pitch) * dist); camera.lookAt(focus);
  // 캐릭터를 가리는 벽은 반투명
  // 카메라 쪽(캐릭터 앞쪽 화면)에 있는 가까운 벽은 낮게 보이게 투명 처리
  const cdx = camera.position.x - focus.x, cdz = camera.position.z - focus.z, cl = Math.hypot(cdx, cdz) || 1;
  walls.forEach(w => { const b = w.geometry.parameters, ox = Math.max(0, Math.abs(focus.x - w.position.x) - b.width / 2), oz = Math.max(0, Math.abs(focus.z - w.position.z) - b.depth / 2);
    const qx = Math.min(Math.max(focus.x, w.position.x - b.width / 2), w.position.x + b.width / 2) - focus.x, qz = Math.min(Math.max(focus.z, w.position.z - b.depth / 2), w.position.z + b.depth / 2) - focus.z;
    const side = (qx * cdx + qz * cdz) / cl, near = Math.hypot(ox, oz) < 5.5;
    w.material.opacity = side > .25 && near ? .12 : 1; w.material.depthWrite = w.material.opacity === 1; });
  const dir = focus.clone().sub(camera.position), L = dir.length(); fadeRay.set(camera.position, dir.normalize()); fadeRay.far = L - .4;
  fadeRay.intersectObjects(walls).forEach(h => { h.object.material.opacity = .12; h.object.material.depthWrite = false; });
  // 자동문: 가까이 가면 열림
  const near = Math.hypot(me.position.x - PX(444), me.position.z - PZ(777)) < 2.2; autoT += ((near ? 1 : 0) - autoT) * Math.min(1, dt * 6); autoDoorL.position.x = PX(416) - autoT * .9; autoDoorR.position.x = PX(472) + autoT * .9;
  Object.values(halls).forEach(h => { h.L.intensity = 1.1 + (beatOn && AC ? Math.pow(1 - (((AC.currentTime - beatStart) / BEAT) % 1), 4) * 1.2 : Math.sin(t * 2) * .1); });
  if (ripT < 1) { ripT += dt * 1.6; rip.material.opacity = 1 - ripT; rip.scale.setScalar(1 + ripT * 2.2); }
  for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; s.userData.t += dt; s.position.addScaledVector(s.userData.v, dt); s.userData.v.y -= dt * 4; s.rotation.y += dt * 6; s.material.opacity = 1 - s.userData.t; if (s.userData.t > 1) { scene.remove(s); sparks.splice(i, 1); } }
  renderer.render(scene, camera); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// ── 화면 위 창 ──
let toastT = null; function toast(m) { const e = $('toast'); e.textContent = m; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2400); }
const modal = $('modal'), card = $('mcard');

modal.addEventListener('click', e => { if (e.target === modal) close(); }); addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) close(); });

  $('nc').onclick = close; $('ns').onclick = () => { const v = $('nt').value.trim(); if (!v) { $('nt').focus(); return; } notes.push(v); store.set('raw_notes', notes.slice(-16)); addNote(v, notes.length - 1); close(); goTo(toV(406, 240)); yaw = 0; toast('로비 벽에 쪽지를 붙였어요'); }; };
$('water').onclick = () => { open(`<h2>💧 물 한 병 건네기</h2><p>연습하다 목마른 사람에게 물 한 병.</p><div class="row">
  <button class="opt" id="w1" type="button"><i>🙋</i><span><b>나에게</b><small>정수기로 가서 마셔요</small></span></button>

  <button class="opt" type="button" disabled><i>🌍</i><span><b>다음 방문자에게</b><small>공개 버전에서 열려요</small></span></button></div><div class="btns"><button class="sec" id="wc" type="button">닫기</button></div>`);
  $('wc').onclick = close; $('w1').onclick = () => { close(); goTo(toV(1150, 560)); toast('정수기로 가는 중… 도착하면 [💧 정수기 물 마시기]'); };
  $('w2').onclick = () => { const msg = `RAW 온라인 연습실에서 너한테 물 한 병 보냈어 💧 연습 같이 하자! - ${nick}`;
    open(`<h2>💌 친구에게 보낼 메시지</h2><p>복사해서 카톡이나 DM으로 보내 주세요.</p><textarea id="wm" readonly>${msg}</textarea><div class="btns"><button class="sec" id="wb" type="button">닫기</button><button class="pri" id="wp" type="button">복사</button></div>`);
    $('wb').onclick = close; $('wp').onclick = () => { const ta = $('wm'); try { navigator.clipboard.writeText(msg).then(() => toast('복사했어요'), () => { ta.select(); toast('선택해 뒀어요 · 길게 눌러 복사'); }); } catch (e) { ta.select(); } }; }; };
$('photo').onclick = () => { renderer.render(scene, camera); let url = ''; try { url = canvas.toDataURL('image/jpeg', .9); } catch (e) {}
  open(`<span class="badge">RAW · ${today.replace(/-/g, '.')}</span><h2>📸 연습실 인증샷</h2><p>사진을 길게 누르거나 오른쪽 클릭해서 저장하세요.</p>${url ? `<img src="${url}" alt="RAW 온라인 연습실에서 찍은 내 캐릭터 사진">` : ''}<div class="btns"><button class="sec" id="pc" type="button">닫기</button></div>`); $('pc').onclick = close; };
$('info').onclick = () => { open(`<span class="badge">REAL STUDIO</span><h2>진짜 RAW 연습실 구경 오기</h2><p>로우댄스학원 수원점에서 직접 춰 봐요.</p>
  <div class="info"><div><span>주소</span><b>수원시 팔달구 매산로 136, 4층</b></div><div><span>전화</span><b>031-225-6600</b></div><div><span>카카오채널</span><b>로우댄스수원점학원</b></div><div><span>인스타그램</span><b><a href="https://www.instagram.com/rawdance_suwon/" target="_blank" rel="noopener">@rawdance_suwon</a></b></div></div>
  <div class="btns"><button class="pri" id="ic" type="button">연습실로 돌아가기</button></div>`); $('ic').onclick = close; };
