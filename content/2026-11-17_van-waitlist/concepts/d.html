if(k==='B2'){const cv=document.getElementById('cv'),W=1080,H=1350,P=10,cols=W/P|0,rows=H/P|0,off=document.createElement('canvas');off.width=cols;off.height=rows;const o=off.getContext('2d');
 o.fillStyle='#000';o.fillRect(0,0,cols,rows);o.fillStyle='#fff';o.textAlign='center';o.textBaseline='middle';
 const fit=(t,fs,y)=>{do{o.font=`400 ${fs}px "Black Han Sans"`;fs--;}while(o.measureText(t).width>cols-8&&fs>6);o.fillText(t,cols/2,y);};

 const d=o.getImageData(0,0,cols,rows).data,g=cv.getContext('2d');g.fillStyle='#050505';g.fillRect(0,0,W,H);
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const on=d[(y*cols+x)*4]>110;g.beginPath();g.arc(x*P+P/2,y*P+P/2,3.8,0,7);g.fillStyle=on?(y<rows*.2||y>rows*.82?'#ff4f9a':'#ffb000'):'#1a1408';g.shadowBlur=on?10:0;g.shadowColor='#ff9a00';g.fill();}}
