<!doctype html><html><head><meta charset="utf-8"><style>
/* 유아·키즈 K-POP반 광고 릴스 글자 3차 (원장님 2026-11-19 "눈에 잘 안 띄는데 / 무료 체험 빼고 / 쌤 이력 강조")
   → 중요한 말은 연두 띠 + 검은 글씨, 큰 글씨는 더 크게, 아래쪽 어둡게 깔아 대비. 쌤 장면 2개 (YUNI · MINKYUNG) */
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:"Gothic A1","Noto Sans KR",sans-serif;color:#fff}
.a{position:absolute}
.sh{text-shadow:0 6px 28px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.5)}
.lime{display:inline-block;background:#D7FF3A;color:#111;font-weight:900;padding:12px 30px;transform:rotate(-3deg);box-shadow:0 12px 28px rgba(0,0,0,.35);text-shadow:none;white-space:nowrap}
.blk{display:inline-block;background:#111;color:#fff;font-weight:900;padding:10px 26px;transform:rotate(-3deg);box-shadow:0 12px 28px rgba(0,0,0,.35);text-shadow:none;white-space:nowrap}
#grad{left:0;right:0;bottom:0;height:1100px;background:linear-gradient(transparent,rgba(8,7,12,.78) 55%)}
#logo{left:60px;top:250px;height:42px}
#tag{left:60px;top:320px;padding:10px 22px;font-size:38px;font-weight:900;color:#111;box-shadow:0 8px 20px rgba(0,0,0,.3)}
#hook{left:0;right:0;top:1080px;text-align:center}
#hook .k{font:700 30px Inter;letter-spacing:.4em;text-indent:.4em}
#hook .t{margin-top:12px;font:italic 400 220px/0.9 "GoGo Poster 2020",Anton}
#hook .t span{display:inline-block;white-space:pre;position:relative}#hook .t span i{position:absolute;left:0;top:0;font-style:inherit}
#hook .lime{margin-top:26px;font-size:54px}
#cap{left:0;right:0;top:1250px;text-align:center}
#cap .e{font:400 170px/0.88 Anton;letter-spacing:.01em}
#cap .lime{margin-top:20px;font-size:56px}
#tch{left:0;right:0;top:1000px;text-align:center}
#tch .d{font:700 32px Inter;letter-spacing:.42em;text-indent:.42em}
#tch .n{margin-top:8px;font:italic 400 200px/0.95 "GoGo Poster 2020",Anton}
#tch .lime{margin-top:24px;font-size:58px}
#tch .blk{margin-top:18px;font-size:44px}
#tch .s{margin-top:24px;font-size:36px;font-weight:800}
#info{left:0;right:0;top:960px;text-align:center}
#info .g{display:flex;justify-content:center;gap:70px}
#info .ko{font-size:44px;font-weight:900}
#info .num{margin-top:4px;font:400 250px/0.85 Anton;color:#D7FF3A}
#info .num small{font-family:"Gothic A1";font-size:64px;font-weight:900;color:#fff;margin-left:6px}
#info .big{font-size:110px;font-weight:900;letter-spacing:-.04em;line-height:1.05}
#info .e{font:400 260px/0.85 Anton}
#info .lime{margin-top:28px;font-size:52px}
#info .s{margin-top:24px;font-size:36px;font-weight:800;line-height:1.5}
#end{inset:0;background:#0b0a0f}
#end .c{position:absolute;left:0;right:0;top:760px;text-align:center}
#end img{width:460px}
#end .k{margin-top:30px;font:700 26px Inter;letter-spacing:.32em;text-indent:.32em;opacity:.85}
#end .lime{margin-top:50px;font-size:48px}
#end .s{margin-top:34px;font-size:30px;font-weight:700;opacity:.75}
</style></head><body>
<div id="grad" class="a"></div>
<img id="logo" class="a" src="logo.png">
<div id="tag" class="a"></div>
<div id="hook" class="a sh"><div class="k">RAW DANCE STUDIO · SUWON</div><div class="t" id="ht"></div><div class="lime">유아 · 키즈 K-POP반 모집</div></div>
<div id="cap" class="a sh"><div class="e"></div><div class="lime"></div></div>
<div id="tch" class="a sh"></div>
<div id="info" class="a sh"></div>
<div id="end" class="a"><div class="c"><img src="logo.png"><div class="k">KIDS K-POP · SUWON</div>
 <div class="lime">상담은 DM @rawdance_suwon</div><div class="s">카카오톡 '로우댄스수원점학원' · 수원역·매교역 근처</div></div></div>
<script>
const $=id=>document.getElementById(id), cl=x=>Math.min(1,Math.max(0,x)), eo=x=>1-Math.pow(1-cl(x),3);
let TL=[], VER='30';
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const AZ="ABCDEFGHIJKLMNOPQRSTUVWXYZ"; let CH=[];
function mk(txt){ const el=$('ht'); el.innerHTML='';
  CH=[...txt].map(c=>{ if(c==='\n'){ el.appendChild(document.createElement('br')); return null; }
    const s=document.createElement('span'); s.textContent=c; const g=document.createElement('i'); s.appendChild(g); el.appendChild(s);
    return {s,g,c,on:0.05+rnd()*0.45,gh:rnd()<0.45,gc:AZ[Math.floor(rnd()*26)]}; }).filter(Boolean); }
const show=(id,on)=>{ $(id).style.display=on?'':'none'; };
const pop=(el,u,dl=0)=>{ const p=eo((u-dl)/0.22); el.style.opacity=p; el.style.transform=(el.dataset.r||'')+` scale(${1.18-0.18*p})`; };
// 쌤 카드 (원장님 확인 2026-11-19, 브랜드 가이드 강사 표)
const TCH={yuni:{d:'MON · WED',n:'T. YUNI',a:'대형 기획사 연습생 출신',b:'',s:'월·수 유아 · 키즈 K-POP'},
           mink:{d:'TUE · THU',n:'T. MINKYUNG',a:'현역 아이돌 백업 댄서',b:'실전 경험 많은 현역 댄서',s:'화·목 유아 · 키즈 K-POP'}};
// 정보 화면 (30초는 3장, 15초는 1장)
const INFO30=[`<div class="g"><div><div class="ko">유아 K-POP</div><div class="num">5–8<small>세</small></div></div><div><div class="ko">키즈 K-POP</div><div class="num">9–12<small>세</small></div></div></div>`,
  `<div class="big">평일반 · 토요일반</div><div class="lime">월·수 YUNI · 화·목 MINKYUNG</div><div class="s">토요일 REGINA</div>`,
  `<div class="e">DM</div><div class="lime">상담은 인스타 DM · 카카오톡</div><div class="s">수원역·매교역 근처 · 건물 내 무료 주차</div>`];
const INFO15=`<div class="g"><div><div class="ko">유아 K-POP</div><div class="num">5–8<small>세</small></div></div><div><div class="ko">키즈 K-POP</div><div class="num">9–12<small>세</small></div></div></div><div class="lime">평일반 · 토요일반 · 상담 DM</div>`;
window.setup=o=>{ TL=o.tl; VER=o.ver; mk('K-POP\nKIDZ'); };
window.render=t=>{
  const seg=TL.find(s=>t>=s.t0&&t<s.t1)||TL[TL.length-1], k=seg.kind, u=t-seg.t0;
  const first=kind=>TL.find(s=>s.kind===kind), last=kind=>[...TL].reverse().find(s=>s.kind===kind);
  show('logo',k!=='logo'); show('grad',k!=='logo');
  show('hook',k==='hook'); if(k==='hook'){ const h=t-first('hook').t0;
    CH.forEach(c=>{ c.s.style.color=h>=c.on?'#fff':'transparent'; c.g.textContent=(c.gh&&h>=c.on-1/24&&h<c.on)?c.gc:''; c.g.style.color='rgba(255,255,255,.4)'; });
    $('hook').querySelector('.k').style.opacity=eo((h-0.05)/0.3); const L=$('hook').querySelector('.lime'); L.dataset.r='rotate(-3deg)'; pop(L,h,0.5); }
  show('tag',k==='mont'); if(k==='mont'){ const y=seg.cls==='유아'; $('tag').textContent=y?'유아 5–8세':'키즈 9–12세'; $('tag').style.background=y?'#FFB3CF':'#D7FF3A'; }
  const m0=first('mont'), m1=last('mont');
  const caps=VER==='30'?[['DANCE','아이돌 안무로 신나게'],['BASICS','기본기까지 탄탄하게'],['EVERY WEEK','평일반 · 토요일반']]:[['DANCE','아이돌 안무로 신나게'],['BASICS','기본기까지 탄탄하게']];
  show('cap',k==='mont'); if(k==='mont'){ const n=caps.length, span=(m1.t1-m0.t0)/n, i=Math.min(n-1,Math.floor((t-m0.t0)/span)), v=t-m0.t0-i*span;
    $('cap').querySelector('.e').textContent=caps[i][0]; const L=$('cap').querySelector('.lime'); L.textContent=caps[i][1]; L.dataset.r='rotate(-3deg)';
    const E=$('cap').querySelector('.e'); E.style.opacity=eo(v/0.18); E.style.transform=`translateY(${(1-eo(v/0.18))*30}px)`; pop(L,v,0.12); }
  show('tch',k==='yuni'||k==='mink'); if(k==='yuni'||k==='mink'){ const c=TCH[k], v=t-first(k).t0;
    if($('tch').dataset.k!==k){ $('tch').dataset.k=k; $('tch').innerHTML=`<div class="d">${c.d}</div><div class="n" style="white-space:nowrap;font-size:${c.n.length>8?128:200}px">${c.n}</div><div class="lime">${c.a}</div>${c.b?`<br><div class="blk">${c.b}</div>`:''}<div class="s">${c.s}</div>`; }
    const T=$('tch'); T.querySelector('.d').style.opacity=eo(v/0.2); const N=T.querySelector('.n'); N.style.opacity=eo(v/0.2); N.style.transform=`translateX(${(1-eo(v/0.25))*-60}px)`;
    const A=T.querySelector('.lime'); A.dataset.r='rotate(-3deg)'; pop(A,v,0.25); const B=T.querySelector('.blk'); if(B){ B.dataset.r='rotate(-3deg)'; pop(B,v,0.45); }
    T.querySelector('.s').style.opacity=eo((v-0.5)/0.3); }
  show('info',k==='info'); if(k==='info'){ const segs=TL.filter(s=>s.kind==='info'), i=segs.indexOf(seg), html=VER==='30'?INFO30[Math.min(i,2)]:INFO15;
    if($('info').dataset.i!==String(i)){ $('info').dataset.i=String(i); $('info').innerHTML=html; }
    $('info').style.opacity=eo(u/0.2); $('info').style.transform=`translateY(${(1-eo(u/0.25))*30}px)`;
    const L=$('info').querySelector('.lime'); if(L){ L.dataset.r='rotate(-3deg)'; pop(L,u,0.3); } }
  show('end',k==='logo'); if(k==='logo'){ const v=t-first('logo').t0; $('end').style.opacity=eo(v/0.35); const L=$('end').querySelector('.lime'); L.dataset.r='rotate(-3deg)'; pop(L,v,0.4); }
};
</script></body></html>
