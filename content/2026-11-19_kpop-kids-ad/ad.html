<!doctype html><html><head><meta charset="utf-8"><style>
/* 유아·키즈 K-POP반 광고 릴스 글자 (원장님 2026-11-19). 영상 위에 얹는 투명 화면, render(t)는 t초 모습만 그림 */
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:"Gothic A1","Noto Sans KR",sans-serif;color:#fff}
.a{position:absolute}
#logo{left:56px;top:250px;height:46px}
#hook{left:0;right:0;top:1130px;text-align:center}   /* 아이 얼굴 가리지 않게 아래쪽 */
#hook .big{font:400 190px/0.9 Anton;letter-spacing:.01em;text-shadow:0 8px 30px rgba(0,0,0,.45)}
#hook .chip{display:inline-block;margin-top:26px;background:#fff;color:#111;padding:14px 30px;border-radius:999px;font-size:46px;font-weight:900;letter-spacing:-.02em}
#cls{left:56px;top:330px;padding:10px 24px;border-radius:999px;font-size:36px;font-weight:900;color:#111}
#cap{left:0;right:0;top:1260px;text-align:center}
#cap span{display:inline-block;background:#111;padding:14px 30px;font-size:62px;font-weight:900;letter-spacing:-.03em;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#shade{left:0;right:0;bottom:0;height:1150px;background:linear-gradient(transparent,rgba(10,8,14,.88) 45%)}
#info{left:70px;right:70px;top:930px}
#info .row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid rgba(255,255,255,.35);padding:22px 4px;font-size:58px;font-weight:900;letter-spacing:-.03em}
#info .row small{font-size:46px;font-weight:800;opacity:.9}
#info .free{margin-top:34px;display:inline-block;background:#D7FF3A;color:#111;padding:16px 34px;border-radius:999px;font-size:54px;font-weight:900}
#cta{left:0;right:0;top:940px;text-align:center}
#cta .t{font-size:84px;font-weight:900;letter-spacing:-.04em;line-height:1.15}
#cta .s{margin-top:22px;font-size:38px;font-weight:700;opacity:.92}
#end{inset:0;background:#0b0a0f}
#end .c{position:absolute;left:0;right:0;top:760px;text-align:center}
#end img{width:440px}
#end .k{margin-top:34px;font-size:40px;font-weight:800}
#end .f{margin-top:30px;display:inline-block;background:#D7FF3A;color:#111;padding:14px 32px;border-radius:999px;font-size:44px;font-weight:900}
#end .s{margin-top:24px;font-size:30px;font-weight:600;opacity:.75}
</style></head><body>
<div id="shade" class="a"></div>
<img id="logo" class="a" src="logo.png">
<div id="cls" class="a"></div>
<div id="hook" class="a"><div class="big">K-POP<br>KIDS</div><div class="chip">유아·키즈 K-POP반 모집</div></div>
<div id="cap" class="a"><span></span></div>
<div id="info" class="a">
 <div class="row"><span>유아 K-POP</span><small>5~8세</small></div>
 <div class="row"><span>키즈 K-POP</span><small>9~12세</small></div>
 <div class="row"><span>평일반 · 토요일반</span><small></small></div>
 <div class="free">무료 체험 1회</div></div>
<div id="cta" class="a"><div class="t">무료 체험 예약은<br>DM 주세요</div><div class="s">수원역·매교역 근처 · 건물 내 무료 주차</div></div>
<div id="end" class="a"><div class="c"><img src="logo.png"><div class="k">로우댄스학원 수원점 · 유아·키즈 K-POP</div>
 <div class="f">무료 체험 1회</div><div class="s">DM @rawdance_suwon · 카카오톡 '로우댄스수원점학원'</div></div></div>
<script>
const $=id=>document.getElementById(id), cl=x=>Math.min(1,Math.max(0,x)), eo=x=>1-Math.pow(1-cl(x),3);
let TL=[], VER='30';
const show=(id,on,o)=>{const e=$(id); e.style.display=on?'':'none'; if(on&&o!==undefined) e.style.opacity=o;};
window.setup=o=>{TL=o.tl; VER=o.ver;};
window.render=t=>{
  const seg=TL.find(s=>t>=s.t0&&t<s.t1)||TL[TL.length-1], k=seg.kind, u=t-seg.t0;
  const first=kind=>TL.find(s=>s.kind===kind), last=kind=>[...TL].reverse().find(s=>s.kind===kind);
  show('logo',k!=='logo'); show('shade',k==='info'||k==='cta');
  // 훅: 튀어나오듯
  show('hook',k==='hook'); if(k==='hook'){ const p=eo(u/0.25); $('hook').style.transform=`scale(${0.85+0.15*p})`; $('hook').style.opacity=p; }
  // 반 표시 (몽타주·정보에서 지금 나오는 아이가 유아인지 키즈인지)
  show('cls',k==='mont'); if(k==='mont'){ const y=seg.cls==='유아'; $('cls').textContent=y?'유아 5~8세':'키즈 9~12세'; $('cls').style.background=y?'#FFB3CF':'#D7FF3A'; }
  // 몽타주 큰 자막: 몽타주 구간을 나눠 차례로
  const m0=first('mont'), m1=last('mont'); const caps=VER==='30'?['아이돌 안무로 신나게','기본기까지 탄탄하게','평일반 · 토요일반']:['아이돌 안무로 신나게','기본기까지 탄탄하게'];
  show('cap',k==='mont'); if(k==='mont'){ const i=Math.min(caps.length-1,Math.floor((t-m0.t0)/((m1.t1-m0.t0)/caps.length))); $('cap').firstElementChild.textContent=caps[i]; }
  // 정보: 줄이 하나씩 (15초는 한 번에)
  show('info',k==='info'); if(k==='info'){ const i0=first('info').t0, step=(last('info').t1-i0)/ (VER==='30'?5:2);
    const n=Math.floor((t-i0)/step); [...$('info').children].forEach((e,i)=>{ const on=VER==='30'?i<=n:true; e.style.opacity=on?eo((t-i0-(VER==='30'?i*step:0))/0.25):0; }); }
  show('cta',k==='cta'); if(k==='cta') $('cta').style.opacity=eo((t-first('cta').t0)/0.3);   // 여러 컷에 걸쳐도 처음 한 번만 나타남
  show('end',k==='logo'); if(k==='logo'){ $('end').style.opacity=eo(u/0.35); }
};
</script></body></html>
