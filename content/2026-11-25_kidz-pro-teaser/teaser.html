<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
/* 키즈 전문반 SEASON 1 티저 릴스 (원장님 2026-11-25 "영상이 따로 없어서 포스터만 띡 올리긴 애매" → 포스터를 움직이는 시즌 예고)
   마지막 장면 = 확정 포스터(story_B1_red) 그대로. 글자는 포스터·검수 통과 문구만 */
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Gothic A1","Noto Sans KR",sans-serif;color:#fff}
.a{position:absolute}.c{left:0;right:0;text-align:center}
#red{inset:0;background:radial-gradient(120% 80% at 50% 35%,#E8202E 0%,#B00F1C 70%,#7E0A14 100%)}
#dot{inset:0;opacity:.16;background-image:radial-gradient(#000 1px,transparent 1px);background-size:4px 4px}
#orig{top:240px;font:600 22px Inter;letter-spacing:.42em;margin-right:-.42em}
#y27{top:690px;font:400 420px/1 Anton;letter-spacing:.02em}
#y27 span{display:inline-block;position:relative}
#sub{top:310px;font-size:48px;font-weight:300;letter-spacing:-.02em}
#raw,#kidz{position:absolute;left:0;right:0;text-align:center;font:400 400px/0.84 Anton}
#raw{top:420px}#kidz{top:756px}
#band{left:50%;top:760px;width:520px;padding:19px 0;background:#111;text-align:center;font:700 34px Inter;letter-spacing:.45em;text-indent:.45em;box-shadow:0 10px 24px rgba(0,0,0,.25)}
#info{top:1130px}
#info .t1{font-size:36px;font-weight:800;margin-bottom:20px}
#info .t2{font-size:64px;font-weight:800;letter-spacing:-.03em}
#info .t3{margin-top:20px;display:inline-block;border:3px solid #fff;padding:6px 26px;font-size:48px;font-weight:800}
#info .t4{margin-top:30px;font-size:28px;font-weight:500;line-height:1.5}
#foot{left:64px;right:64px;bottom:250px;text-align:center;font-size:26px;line-height:1.6;font-weight:500}
#foot small{display:block;font-size:19px;opacity:.7}
#soon{top:1545px;font:700 30px Inter;letter-spacing:.5em;text-indent:.5em;opacity:0}
#flash{inset:0;background:#fff;opacity:0}
</style></head><body>
<div id="red" class="a"><div id="dot" class="a"></div></div>
<div id="orig" class="a c">A RAW DANCE STUDIO ORIGINAL</div>
<div id="y27" class="a c"></div>
<div id="sub" class="a c">우리 아이의 <b style="font-weight:800">첫 시즌</b>이 시작됩니다</div>
<div id="raw">RAW</div><div id="kidz">KIDZ</div>
<div id="band" class="a">SEASON 1</div>
<div id="info" class="a c"><div class="t1">RAW KIDZ 팀 구성 예정</div><div class="t2">2027 키즈 전문반 모집</div><div class="t3">10~13세</div><div class="t4">체계적인 트레이닝 후 RAW KIDZ 팀으로<br>공연·대회 참여 예정</div></div>
<div id="foot" class="a"><b style="font-weight:800">상담</b> 인스타 DM · 카카오톡 '로우댄스수원점학원' · 031-225-6600<small>로우댄스학원 수원점 · 수원역·매교역 근처 매산로 136, 4층 · 일정은 상담 때 안내</small></div>
<div id="soon" class="a c">NOW RECRUITING</div>
<div id="flash" class="a"></div>
<script>
const $=id=>document.getElementById(id), cl=x=>Math.min(1,Math.max(0,x)), eo=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let seed=11; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const AZ="0123456789"; const Y=[..."2027"].map(ch=>({ch,on:0.25+rnd()*0.45,g:AZ[Math.floor(rnd()*10)]}));
window.setup=()=>{ $('y27').innerHTML=Y.map((c,i)=>`<span id="yy${i}"></span>`).join(''); };
const set=(id,o,tr)=>{ const e=$(id); e.style.opacity=o; if(tr!==undefined) e.style.transform=tr; };
window.render=t=>{
  // 0~2.4초: 검은 화면 · ORIGINAL · 2027이 숫자 탁탁 켜짐
  const red=eo((t-2.3)/0.35);
  $('red').style.clipPath=`circle(${red*140}% at 50% 50%)`;
  set('orig', t<2.3? eo((t-0.1)/0.4) : 1);
  Y.forEach((c,i)=>{ const e=$('yy'+i); const on=t>=c.on; e.textContent= on? c.ch : (t>=c.on-0.08? c.g : ''); e.style.color= on?'#fff':'rgba(255,255,255,.35)'; });
  const yo= t<1.9? 1 : 1-eo((t-1.9)/0.35); $('y27').style.opacity=yo; $('y27').style.transform=`scale(${1+ (t>1.9? eo((t-1.9)/0.35)*0.25:0)})`; $('y27').style.letterSpacing=(0.02+ (t<1.9? Math.max(0,(t-0.7))*0.03 : 0.04))+'em';
  // 2.6초~: RAW 쿵 · 3.1초 KIDZ 쿵 (살짝 흔들림)
  const shake=(t0)=>{ const u=t-t0; return u>0&&u<0.25? `translate(${Math.sin(u*90)*10*(1-u/0.25)}px,${Math.cos(u*70)*6*(1-u/0.25)}px)` : ''; };
  const ra=back((t-2.6)/0.3), ka=back((t-3.1)/0.3);
  set('raw', cl((t-2.6)/0.08), `${shake(2.9)} scale(${1.6-0.6*ra})`);
  set('kidz', cl((t-3.1)/0.08), `${shake(3.4)} scale(${1.6-0.6*ka})`);
  // 3.8초: SEASON 1 띠 쾅 + 번쩍
  const bb=back((t-3.8)/0.28);
  set('band', cl((t-3.8)/0.06), `translate(-50%,-50%) rotate(${-4 - (1-bb)*14}deg) scale(${2.2-1.2*bb})`);
  $('flash').style.opacity = t>=3.8&&t<4.1? 0.7*(1-(t-3.8)/0.3) : (t>=2.6&&t<2.75? 0.35*(1-(t-2.6)/0.15) : 0);
  // 4.6초~ 부제, 5.4초~ 정보 차례로, 7.4초~ 상담
  set('sub', eo((t-4.6)/0.5), `translateY(${(1-eo((t-4.6)/0.5))*24}px)`);
  const I=$('info').children; [5.4,5.9,6.4,6.9].forEach((s,i)=>{ const p=eo((t-s)/0.4); I[i].style.opacity=p; I[i].style.transform=(i===2?'':'')+`translateY(${(1-p)*30}px)`; });
  set('foot', eo((t-7.4)/0.5));
  // 8.6초~ 끝: 아래 NOW RECRUITING (검수 2026-11-25: COMING 2027은 2027년에 모집 시작으로 오해) 깜빡임 없이 은은하게
  set('soon', eo((t-8.6)/0.6)*0.85);
};
</script></body></html>
