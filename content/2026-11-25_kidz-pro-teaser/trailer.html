<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
/* 키즈 전문반 SEASON 1 블록버스터 예고편 (원장님 2026-11-25 "진짜 블록버스터 예고편처럼, 조금 변형")
   검은 화면 + 위아래 시네마 바 + 먼지·연기 + 쾅(번쩍·흔들림) 타이틀 카드 → 크롬 RAW KIDZ + 빛 지나감 → SEASON 1 → 모집 정보
   글자는 검수 통과 문구만. 박자(쾅) 시각은 HITS — 음악이 정해지면 그 곡 박자에 맞춰 옮김 */
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Gothic A1","Noto Sans KR",sans-serif;color:#fff}
.a{position:absolute}
#bg{inset:0;background:radial-gradient(70% 45% at 50% 50%,#2a0508 0%,#0b0102 55%,#000 100%)}
#fog1,#fog2{inset:-20%;opacity:.5;mix-blend-mode:screen}
#fog1{background:radial-gradient(40% 25% at 30% 60%,rgba(180,20,30,.35),transparent 70%),radial-gradient(35% 22% at 75% 40%,rgba(120,10,20,.3),transparent 70%)}
#fog2{background:radial-gradient(45% 30% at 60% 70%,rgba(255,255,255,.06),transparent 70%),radial-gradient(30% 20% at 20% 30%,rgba(255,255,255,.05),transparent 70%)}
#dust{inset:0}#dust i{position:absolute;border-radius:50%;background:#fff}
.bar{left:0;right:0;height:250px;background:#000;z-index:5}#bt{top:0}#bb{bottom:0}
.card{left:0;right:0;top:50%;text-align:center;transform:translateY(-50%);opacity:0;z-index:3}
.card .s{font:italic 400 42px "GoGo Poster 2020";letter-spacing:.22em;text-indent:.22em;color:#d9d9d9}
.card .k{font:400 128px/1.22 "Black Han Sans";letter-spacing:.02em;text-indent:.02em;background:linear-gradient(180deg,#ffffff 0%,#f1f1f1 40%,#b5b5b5 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(255,40,60,.4))}
.card .ag{font:italic 400 60px "GoGo Poster 2020";letter-spacing:.5em;text-indent:.5em;color:#ccc;margin-bottom:10px}
.card .y{font:italic 400 290px/0.9 "GoGo Poster 2020";letter-spacing:.02em;background:linear-gradient(180deg,#fff,#d6d6d6 50%,#7a7a7a);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(232,32,46,.45))}
#title{z-index:3;left:0;right:0;top:430px;text-align:center;opacity:0}
#title .rk{position:relative;font:italic 400 330px/0.88 "GoGo Poster 2020";letter-spacing:.04em;text-indent:.04em;background:linear-gradient(105deg,rgba(255,255,255,0) 42%,rgba(255,255,255,1) 50%,rgba(255,255,255,0) 58%),linear-gradient(180deg,#ffffff 0%,#e9e9e9 30%,#9a9a9a 52%,#f2f2f2 60%,#7a7a7a 100%);background-size:300% 100%,100% 100%;background-repeat:no-repeat;-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.6)) drop-shadow(0 0 40px rgba(232,32,46,.45))}
#band{left:50%;top:712px;width:520px;padding:16px 0;background:#E8202E;text-align:center;font:italic 400 52px "GoGo Poster 2020";letter-spacing:.3em;text-indent:.4em;box-shadow:0 0 50px rgba(232,32,46,.7);z-index:4;opacity:0}
#flare{left:-10%;right:-10%;top:712px;height:6px;background:linear-gradient(90deg,transparent,rgba(255,120,130,.0) 10%,rgba(255,200,205,.95) 50%,rgba(255,120,130,0) 90%,transparent);filter:blur(2px);opacity:0;z-index:4}
#info{left:0;right:0;top:1070px;text-align:center;z-index:4}
#info div{opacity:0}
#info .i1{font:400 68px "Black Han Sans";letter-spacing:.02em}
#info .i2{margin-top:26px;display:inline-block;border:3px solid #fff;padding:4px 28px;font:400 50px "Black Han Sans"}
#info .i3{margin-top:26px;font-size:32px;font-weight:700;line-height:1.55;color:#ddd}
#tag{left:0;right:0;top:1415px;text-align:center;z-index:6;font:italic 400 50px "GoGo Poster 2020";letter-spacing:.35em;text-indent:.35em;opacity:0}
#foot{left:90px;right:90px;top:1495px;text-align:center;z-index:6;font-size:26px;line-height:1.55;color:#cfcfcf;opacity:0}
#foot small{display:block;font-size:20px;opacity:.7;margin-top:4px}
#orig{left:0;right:0;top:310px;text-align:center;z-index:6;font:italic 400 34px "GoGo Poster 2020";letter-spacing:.35em;text-indent:.35em;color:#bbb;opacity:0}
#flash{inset:0;background:#fff;opacity:0;z-index:9}
#rgb{inset:0;z-index:8;pointer-events:none}
</style></head><body>
<div id="bg" class="a"></div><div id="fog1" class="a"></div><div id="fog2" class="a"></div><div id="dust" class="a"></div>
<div id="c0" class="a card"><div class="s">RAW DANCE STUDIO SUWON</div></div>
<div id="c1" class="a card"></div>
<div id="c2" class="a card"></div>
<div id="c3" class="a card"></div>
<div id="c4" class="a card"></div>
<div id="c5" class="a card"></div>
<div id="title" class="a"><div class="rk" id="rk">RAW<br>KIDZ</div></div>
<div id="flare" class="a"></div>
<div id="band" class="a" data-qa="overlay">SEASON 1</div>
<div id="info" class="a"><div class="i1">키즈 전문반 · 12월 개강 예정</div><div class="i2">10~13세</div><div class="i3">체계적인 트레이닝 후 RAW KIDZ 팀으로<br>공연·대회 참여 예정</div></div>
<div id="orig" class="a">RAW DANCE STUDIO SUWON</div>
<div id="tag" class="a">NOW RECRUITING</div>
<div id="foot" class="a"><b>상담</b> 인스타 DM · 카톡 '로우댄스수원점학원' · 031-225-6600<small>로우댄스학원 수원점 · 수원역·매교역 근처 매산로 136, 4층 · 요일·시간은 상담 때 안내</small></div>
<div id="bt" class="a bar"></div><div id="bb" class="a bar"></div>
<div id="flash" class="a"></div>
<script>
const $=id=>document.getElementById(id), cl=x=>Math.min(1,Math.max(0,x)), eo=x=>1-Math.pow(1-cl(x),3), ei=x=>cl(x)*cl(x);
let seed=5; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
// 카드: [id, 쾅 시각, 사라짐 시각]
// 음악 MA_VasilYatsevich_NoiseTherapy (원장님 2026-11-25 모션어레이, 24초 · 115 BPM): 가장 큰 쾅 4.65초, 본 비트 10.39초부터 4박(2.087초)마다 카드
// 2026-11-25 2차: 곡에서 직접 잰 큰 소리 — 4.66(가장 큼) 6.75 9.89(구간 시작) 11.71 12.50 13.41(강) 16.15(구간 시작) 19.5(구간 시작)
const CARDS=[['c0',0.5,4.2,false],['c1',4.66,6.55,true],['c2',6.75,9.0,true],['c3',9.89,11.6,true],['c4',11.71,12.42,true],['c5',12.50,13.33,true]];
const T_TITLE=13.41, T_BAND=16.15, T_INFO=16.9, END=22.5;
const HITS=[4.66,6.75,9.89,11.71,12.50,T_TITLE,T_BAND,19.5];
// 원장님 2026-11-25: A안(나이로 꽂기)·C안(작은 댄서들) 두 개, 글꼴 F(GoGo Poster + 블랙한산스)
const COPY={
  A:['<div class="ag">AGES</div><div class="y">10–13</div>','<div class="k">12월<br>키즈 전문반<br>개강 예정</div>','<div class="k">어린 나이부터<br>체계적으로</div>','<div class="k">한 팀이 되어</div>','<div class="k">무대와<br>대회를 향해</div>'],
  C:['<div class="k">12월<br>키즈 전문반<br>개강 예정</div>','<div class="k">작은 댄서들의<br>첫 시즌</div>','<div class="k">어린 나이부터,<br>제대로</div>','<div class="k">한 팀으로</div>','<div class="k">무대와<br>대회를 향해</div>']};
const D=[]; window.setup=(arg)=>{ const v=(arg&&arg.v)||'A';
  // overlay: AI 배경 영상 위에 얹을 글자만 (배경 투명) — 원장님 2026-11-25 "AI 영상 티 안 나게 뒷배경으로 어둡게"
  // ad: 광고 릴스용 (원장님 2026-11-25 "광고용 C안") — 광고는 아래 35%를 버튼·문구가, 위 14%를 계정 줄이 덮음 → 끝 화면을 270~1250px 안에, 상담 줄은 빼고(광고 버튼이 대신)
  if(arg&&arg.ad){ const st=document.createElement('style'); st.textContent=`
    #orig{top:285px} #title{top:350px} #title .rk{font-size:262px}
    #band{top:592px;width:470px;font-size:46px;padding:13px 0} #flare{top:592px}
    #info{top:865px} #info .i1{font-size:60px} #info .i2{margin-top:18px;font-size:44px} #info .i3{margin-top:18px;font-size:30px}
    #tag{top:1168px;font-size:46px} #foot{display:none}`; document.head.appendChild(st); }
  if(arg&&arg.overlay){ document.documentElement.style.background=document.body.style.background='transparent'; $('bg').style.display='none'; $('fog1').style.opacity=.22; $('fog2').style.opacity=.35; } COPY[v].forEach((h,i)=>$('c'+(i+1)).innerHTML=h); const el=$('dust'); for(let i=0;i<90;i++){ const s=1+rnd()*3.5; const d=document.createElement('i'); d.style.width=d.style.height=s+'px'; el.appendChild(d); D.push({d,x:rnd()*1080,y:rnd()*1920,vx:(rnd()-.5)*18,vy:-6-rnd()*22,o:.15+rnd()*.5,s}); } };
window.render=t=>{
  D.forEach(p=>{ p.d.style.transform=`translate(${p.x+p.vx*t}px,${((p.y+p.vy*t)%1920+1920)%1920}px)`; p.d.style.opacity=p.o*(.6+.4*Math.sin(t*2+p.x)); p.d.style.filter=p.s>3?'blur(1.5px)':'none'; });
  $('fog1').style.transform=`translate(${Math.sin(t*.3)*40}px,${Math.cos(t*.25)*30}px) scale(${1+t*.01})`;
  $('fog2').style.transform=`translate(${Math.cos(t*.2)*-50}px,${Math.sin(t*.3)*20}px)`;
  // 쾅: 번쩍 + 흔들림
  let fl=0, sh=0; HITS.forEach(h=>{ const u=t-h; if(u>=0&&u<0.35){ fl=Math.max(fl,(h===T_TITLE?1:.8)*(1-u/0.35)); } if(u>=0&&u<0.3) sh=Math.max(sh,1-u/0.3); });
  $('flash').style.opacity=fl;
  const shake=sh?`translate(${Math.sin(t*120)*14*sh}px,${Math.cos(t*95)*10*sh}px)`:'';
  CARDS.forEach(([id,a,b,hit])=>{ const e=$(id); const inn=hit? (t>=a?1:0) : eo((t-a)/0.6); const out=1-eo((t-b+0.25)/0.25); const o=t<a?0:Math.min(inn,out);
    e.style.opacity=o; const zoom=1+(t-a)*0.035; e.style.transform=`translateY(-50%) ${t>=a&&t<a+0.3?shake:''} scale(${hit? (t<a+0.12? 1.25-((t-a)/0.12)*0.25 : zoom) : zoom})`; e.style.filter= hit&&t>=a&&t<a+0.15? 'blur(2px)':'none'; });
  // 타이틀: 쾅 + 서서히 다가옴 + 빛 지나감
  const ti=$('title'); ti.style.opacity=t>=T_TITLE?1:0;
  const tz=t<T_TITLE+0.15? 1.35-((t-T_TITLE)/0.15)*0.35 : 1+(t-T_TITLE)*0.005;
  ti.style.transform=`${t>=T_TITLE&&t<T_TITLE+0.3?shake:''} scale(${Math.max(1,tz)})`;
  $('rk').style.backgroundPosition=`${100-cl((t-T_TITLE-0.4)/1.2)*100}% 0, 0 0`;   // 빛이 글자 안에서만 왼→오
  // SEASON 1 띠 + 가로 빛줄기
  const bp=t>=T_BAND? Math.min(1,(t-T_BAND)/0.12):0;
  $('band').style.opacity=bp; $('band').style.transform=`translate(-50%,-50%) rotate(-4deg) scale(${t<T_BAND+0.12?1.8-0.8*bp:1}) ${t>=T_BAND&&t<T_BAND+0.3?shake:''}`;
  $('flare').style.opacity= t>=T_BAND? Math.max(0,1-(t-T_BAND)/0.9)*.9 : 0; $('flare').style.transform=`scaleX(${0.3+cl((t-T_BAND)/0.5)})`;
  // 정보 → 끝
  [...$('info').children].forEach((e,i)=>{ const p=eo((t-T_INFO-i*0.45)/0.5); e.style.opacity=p; e.style.transform=`translateY(${(1-p)*24}px)`; });
  $('orig').style.opacity=eo((t-T_TITLE-0.6)/0.6)*.85;
  $('tag').style.opacity=eo((t-19.5)/0.3)*(.8+.2*Math.sin(t*4));
  $('foot').style.opacity=eo((t-19.9)/0.6);
  // 시네마 바: 타이틀 뒤로 열림 (세로 화면 꽉 채움)
  const open=eo((t-T_INFO+0.2)/0.8); $('bt').style.transform=`translateY(${-open*250}px)`; $('bb').style.transform=`translateY(${open*250}px)`;
  // 끝은 어둡게 하지 않음 (마지막 모집 화면 그대로 유지, 밝기 0 변화)
  document.body.style.filter=`brightness(${1-eo((t-(END-0.6))/0.6)*0.0})`;
};
</script></body></html>
