<!doctype html><html><head><meta charset="utf-8"><style>
/* TRACKPAD 끝 로고 (원장님 2026-11-17 "RAW 로고만, 화면 전환되고도 음원이 이어지게")
   영상 위에 얹는 투명 화면: 0~0.4초 검은 화면이 덮이면서 로고가 또렷해짐 → 끝까지 유지. 소리는 add_title.js가 영상 소리를 그대로 이어 줌 */
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
#bg{position:absolute;inset:0;background:#0b0a0f;opacity:0}
#gl{position:absolute;left:50%;top:50%;width:1300px;height:1300px;margin:-650px 0 0 -650px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,92,255,.30),rgba(124,92,255,0) 60%);opacity:0}
#lg{position:absolute;left:50%;top:50%;width:520px;transform:translate(-50%,-50%);opacity:0}
</style></head><body><div id="bg"></div><div id="gl"></div><img id="lg" src="raw-logo-tight.png">
<script>
const $=id=>document.getElementById(id), cl=x=>Math.min(1,Math.max(0,x)), eo=x=>1-Math.pow(1-cl(x),3);
window.setup=o=>{};
window.render=t=>{
  $('bg').style.opacity=eo(t/0.4);
  const a=eo((t-0.15)/0.6); $('lg').style.opacity=a;
  $('lg').style.transform=`translate(-50%,-50%) scale(${1.07-0.07*a})`; $('lg').style.filter=`blur(${(1-a)*10}px)`;
  $('gl').style.opacity=eo((t-0.3)/0.9)*(0.85+0.15*Math.sin(t*2.2));
};
</script></body></html>
