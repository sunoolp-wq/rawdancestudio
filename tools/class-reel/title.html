<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:Montserrat,"Noto Sans KR",sans-serif;color:#fff}
#w{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;text-align:center;text-shadow:0 2px 18px rgba(0,0,0,.35)}
#trk{font-weight:500;font-size:30px;letter-spacing:.18em;white-space:nowrap}
#t{margin-top:6px;font-weight:800;font-style:italic;font-size:156px;line-height:1;letter-spacing:-.02em;white-space:nowrap}
#n{margin-top:12px;font-weight:700;font-size:44px;white-space:nowrap}
</style></head><body><div id="w"><div id="trk"></div><div id="t"></div><div id="n"></div></div>
<script>
const $=id=>document.getElementById(id);const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
let O;window.setup=o=>{O=o;$("trk").textContent=o.track||"";if(!o.track)$("trk").style.display="none";
 $("t").textContent=o.title;$("n").textContent=o.name;$("w").style.top=(o.y||820)+"px";
 const t=$("t");let fs=156;while(t.scrollWidth>1000&&fs>70){fs-=4;t.style.fontSize=fs+"px";}};
window.render=s=>{ // TRACKPAD 느낌: 글자 간격이 벌어지며 나타났다가 사라짐
 const a=O.in||0.3,b=O.out||2.6;
 const i=ease((s-a)/.55), o=1-ease((s-b)/.4), op=Math.min(i,o);
 $("w").style.opacity=op;
 $("t").style.letterSpacing=(-0.02+0.03*i)+"em";
 $("n").style.letterSpacing=(0.25+0.35*ease((s-a-.1)/.9))+"em"; $("n").style.marginRight=-(0.25+0.35*ease((s-a-.1)/.9))+"em";
 $("trk").style.letterSpacing=(0.1+0.12*ease((s-a)/.9))+"em";
 $("w").style.transform=`translateY(${(1-i)*14}px)`;
};
</script></body></html>
