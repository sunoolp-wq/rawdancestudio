<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
body{color:#fff}
.ln{position:absolute;left:0;right:0;display:flex;justify-content:center;white-space:nowrap}
.ln span{display:inline-block;white-space:pre;position:relative}
.ln span i{position:absolute;left:0;top:0;font-style:inherit}
#trk{font-family:Montserrat,sans-serif;font-weight:500;font-size:38px}
#t{font-family:"GoGo Poster 2020",Montserrat,sans-serif;font-style:italic;font-size:150px;line-height:1}
#n{font-family:"GoGo Poster 2020",Montserrat,sans-serif;font-size:58px;line-height:1}
</style></head><body><div class="ln" id="trk"></div><div class="ln" id="t"></div><div class="ln" id="n"></div>
<script>
/* 원장님 TRACKPAD 원본(24fps) 프레임 측정값으로 재현 (2026-11-05)
   - 큰 줄: 0.04~0.42초 사이 글자마다 무작위로 켜짐. 켜지기 직전 1프레임은 '엉뚱한 회색 글자'(약 40%)
   - 큰 줄 자간: 다 켜진 직후(+0.023em) → 0.46~0.70초에 쫀쫀하게 모임(-0.006em)
   - 이름: 0.54~0.63초 빠르게 켜짐(자간 0.15→0.126em) / 곡명: 0.50~0.72초
   - 퇴장: 4.33~4.92초 글자마다 무작위로 꺼짐. 꺼지기 직전 1프레임 회색 글자(약 35%), 이름·곡명이 먼저 사라짐 */
const $=id=>document.getElementById(id);
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const ease=x=>{x=Math.min(Math.max(x,0),1);return 1-Math.pow(1-x,3)};
const AZ="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let O,LINES=[];
function mk(el,txt,cfg){el.innerHTML="";
  const chars=[...txt].map(c=>{const s=document.createElement("span");s.textContent=c;const g=document.createElement("i");s.appendChild(g);el.appendChild(s);
    const blank=c===" ";
    return {s,g,c,blank,on:cfg.in0+rnd()*(cfg.in1-cfg.in0),off:cfg.out0+rnd()*(cfg.out1-cfg.out0),
      gin:rnd()<cfg.pg,gout:rnd()<(cfg.pgo??cfg.pg*0.9),gch:AZ[Math.floor(rnd()*26)],gch2:AZ[Math.floor(rnd()*26)],gv:0.25+rnd()*0.6,gv2:0.2+rnd()*0.6}});
  // 대시·짧은 기호는 먼저 켜지고 늦게 꺼지는 경향
  chars.forEach(c=>{if(c.c==='-'){c.on=cfg.in0;c.off=cfg.out1;}});
  // 퇴장: 무작위 순서지만 거의 1프레임에 1글자씩 고르게 꺼짐 (원본 측정. 뭉쳐서 꺼지면 렉 걸린 느낌)
  const vis=chars.filter(c=>!c.blank&&c.c!=='-'); const ord=vis.map((c,i)=>[rnd(),c]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
  const last=chars.some(c=>c.c==='-')?cfg.out1-(cfg.out1-cfg.out0)/Math.max(ord.length,1):cfg.out1;
  ord.forEach((c,i)=>{c.off=cfg.out0+(last-cfg.out0)*(ord.length>1?i/(ord.length-1):0)+(rnd()-.5)*0.012;});
  LINES.push({el,chars,cfg});
}
window.setup=o=>{O=o;
  // 가로 영상(유튜브 1920x1080)도 같은 자막 (2026-11-17): 화면 크기만 바꾸고 세로 위치는 같은 비율(862/1920)
  if(o.w){ for(const e of [document.documentElement,document.body]){ e.style.width=o.w+'px'; e.style.height=o.h+'px'; } }
  const H=o.h||1920, MAXW=(o.w||1080)-70;
  const y=o.y||Math.round(862*H/1920), k=o.offset||0; // y: 큰 줄 글자 윗선
  mk($("t"),o.title,{in0:0.04,in1:0.42,out0:4.585,out1:4.96,pg:0.4,pgo:0.12,
    keys:[[0,0.015,"lin"],[0.25,0.015,"out"],[0.50,0.043,"step"],[0.563,0.043,"step"],[0.5631,0.007,"lin"],[0.667,0.013,"lin"]]});
  mk($("n"),o.name,{in0:0.55,in1:0.585,out0:4.545,out1:4.72,pg:0.0,pgo:0,ls1:0.168});
  if(o.track) mk($("trk"),o.track,{in0:0.55,in1:0.585,out0:4.545,out1:4.72,pg:0.08,pgo:0.05,ls1:0.16}); else $("trk").style.display="none";
  // 세로 배치 (원본 비율: 곡명 윗선 776 / 큰 줄 862 / 이름 996, 1080x1920 기준)
  const t=$("t"); let fs=150; t.style.letterSpacing="0em";
  const tw=()=>{const sp=t.querySelectorAll("span");return sp[sp.length-1].getBoundingClientRect().right-sp[0].getBoundingClientRect().left;};
  while(tw()>MAXW&&fs>80){fs-=4;t.style.fontSize=fs+"px";}
  const capTop=v=>v; // 글꼴 윗여백 보정
  // 세 줄 간격을 위아래 똑같이 (원장님 2026-11-18 "위아래 간격이 균일하지 않아 비율이 별로": 예전엔 곡명↔큰 줄 61px, 큰 줄↔이름 32px)
  // 글꼴별 실제 글자(잉크) 위치 비율로 계산: 큰 줄 잉크 윗선 = 글자 상자 위 + 0.233fs, 높이 0.673fs / 이름 0.2·0.672 / 곡명 0.27·0.70
  const Y=y+1, G=Math.round(0.3*fs);
  $("t").style.top=(Y-0.233*fs)+"px";
  $("n").style.top=(Y+0.673*fs+G-0.2*58)+"px";
  $("trk").style.top=(Y-G-0.70*38-0.27*38+(o.trkdy||0))+"px";
};
// 자막 길이(len초, 1~5)에 맞추기 (원장님 2026-11-18 "통째로 비율, 5초 = 원본"): 5초 동작 전체를 len초에 고르게 압축
// → 2초면 켜짐·머묾·꺼짐 모두 2.5배 빠름 (예전엔 등장·퇴장만 √배라 짧을수록 '이미 떠 있다가 사라지는' 느낌)
const SPD=()=>Math.min(5,Math.max(1,(O&&O.len)||5))/5;
const tmap=u=>u/SPD();
window.render=(u)=>{ const s=tmap(u);
  LINES.forEach(({el,chars,cfg})=>{
    let ls;
    if(cfg.keys){ // 원본 프레임 측정: 켜지는 동안 천천히 벌어짐 → 1프레임에 '싹' 모임(살짝 더 좁게) → 2프레임 동안 자리 잡음
      const K=cfg.keys; ls=K[0][1];
      for(let i=1;i<K.length;i++){const [t0,v0,e]=K[i-1],[t1,v1]=K[i];
        if(s>=t0&&s<t1){const x=(s-t0)/(t1-t0); ls=v0+(v1-v0)*(e==="out"?ease(x):e==="step"?0:x); break;}
        if(s>=t1) ls=v1;}
    } else ls=cfg.ls1;
    el.style.letterSpacing=ls+"em"; el.style.paddingLeft=ls+"em";
    const F=1/24/SPD();   // 회색 글자 1프레임은 빨라져도 실제로 한 프레임은 보이게
    chars.forEach(c=>{
      let show=false,ghost=null,gv=1;
      if(s>=c.on && s<c.off) show=true;
      if(c.gin && s>=c.on-F && s<c.on){ghost=c.gch;gv=c.gv;}
      if(c.gout && s>=c.off && s<c.off+F){ghost=c.gch2;gv=c.gv2;}
      c.s.style.color=show?"#fff":"transparent";
      c.g.textContent=ghost&&!c.blank?ghost:""; c.g.style.color=`rgba(255,255,255,${gv})`;
    });
  });
};
</script></body></html>
