<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0e0d12;overflow:hidden}
body{color:#f4f2ee;font-family:Montserrat,"Noto Sans KR",sans-serif}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#0e0d12}
.g{position:absolute;border-radius:50%;pointer-events:none}

.hd{position:absolute;left:72px;right:72px;top:52px;display:flex;align-items:flex-end;justify-content:space-between}
.hd .l{display:flex;align-items:flex-end;gap:34px}
.hd img{height:54px;margin-bottom:10px}
#sn{font-weight:900;font-style:italic;font-size:96px;line-height:.86;letter-spacing:-.03em}
#sn span{color:transparent;-webkit-text-stroke:2.5px #b9a6ff}
.hd .r{text-align:right}
#dd{font-weight:900;font-style:italic;font-size:64px;line-height:.9;color:#b9a6ff}
#per{margin-top:10px;font-weight:600;font-size:20px;letter-spacing:.32em;color:#8f8a9c;margin-right:-.32em}
.rule{position:absolute;left:72px;right:72px;top:176px;height:1px;background:#2f2c38}

#rank{position:absolute;left:72px;top:206px;width:1130px}
.cap{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:20px;letter-spacing:.4em;color:#b9a6ff;margin-bottom:14px}
.cap i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#b9a6ff;box-shadow:0 0 18px #b9a6ff;margin-right:14px;vertical-align:1px}
#pg{letter-spacing:.2em;color:#6f6a7c;font-size:18px}
.row{display:grid;grid-template-columns:92px 1fr 150px 130px 150px;align-items:center;height:64px;padding:0 26px;margin-bottom:8px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
.row.top{background:linear-gradient(90deg,rgba(185,166,255,.16),rgba(185,166,255,.03));border-color:rgba(185,166,255,.28)}
.rk{font-weight:900;font-style:italic;font-size:34px;color:#6f6a7c}
.row.top .rk{color:#f4f2ee;font-size:40px}
.nm{font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-family:Montserrat;font-weight:600;font-size:16px;letter-spacing:.12em;color:#8f8a9c;margin-left:16px}
.st{font-weight:800;font-size:26px;color:#f5be46;text-align:right}
.st.off{color:#4a4655}
.pt{font-weight:900;font-size:32px;text-align:right}
.pt small{font-weight:600;font-size:15px;color:#8f8a9c;margin-left:6px}
.tb{justify-self:center;font-weight:800;font-size:15px;letter-spacing:.14em;padding:7px 14px;border-radius:8px;border:1.5px solid}
.t-ROOKIE{color:#8f8a9c;border-color:#4a4655}
.t-CREW{color:#7fd1ff;border-color:rgba(127,209,255,.55)}
.t-CORE{color:#0e0d12;background:#b9a6ff;border-color:#b9a6ff}
.t-RAW{color:#0e0d12;background:linear-gradient(135deg,#ffe29a,#f5be46);border-color:#f5be46;box-shadow:0 0 22px rgba(245,190,70,.45)}
/* 오른쪽 */

.card{border-radius:18px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);padding:22px 30px;margin-bottom:16px}
.fl{display:flex;align-items:center;justify-content:space-between;height:48px;border-bottom:1px solid rgba(255,255,255,.06)}
.fl:last-child{border-bottom:0}
.fl b{font-family:"Noto Sans KR";font-weight:900;font-size:26px}
.fl b em{font-style:normal;font-family:Montserrat;font-weight:900;font-style:italic;color:#6f6a7c;font-size:22px;margin-right:16px}
.fl span{font-weight:900;font-size:30px;color:#f5be46}
.fl span small{font-size:16px;font-weight:600;color:#8f8a9c;margin-left:4px}
.tr{display:grid;grid-template-columns:120px 1fr 64px;align-items:center;gap:16px;height:40px}
.tr .bar{height:12px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.tr .bar i{display:block;height:100%;border-radius:6px}
.tr b{font-weight:900;font-size:24px;text-align:right}

#tt{display:inline-block;padding-left:100%;font-family:"Noto Sans KR";font-weight:900;font-size:30px;animation:mq 60s linear infinite}
#tt .s{margin:0 26px;opacity:.45}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#upd{position:absolute;left:72px;bottom:94px;font-size:15px;letter-spacing:.12em;color:#4a4655}
.fade{animation:fd .6s ease both}

<script>
const TIERS = ['RAW', 'CORE', 'CREW', 'ROOKIE'];
const TCOL = { RAW: '#f5be46', CORE: '#b9a6ff', CREW: '#7fd1ff', ROOKIE: '#4a4655' };
const PER = 10, ROT = 8000;
let DATA = null, page = 0;

function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); const st = document.getElementById('stage');
  st.style.transform = `scale(${s})`; st.style.left = (innerWidth - 1920 * s) / 2 + 'px'; st.style.top = (innerHeight - 1080 * s) / 2 + 'px'; }
addEventListener('resize', fit); fit();

const D = s => new Date(s + 'T00:00:00');
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const monday = s => { const d = D(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const addDays = (s, n) => { const d = D(s); d.setDate(d.getDate() + n); return ymd(d); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 시트 값 → 학생별 점수·연속 기록·티어
function compute(raw) {
  const cfg = {}; raw.cfg.slice(1).forEach(r => { if (r[0] !== '') cfg[String(r[0]).trim()] = r[1]; });
  const S = String(cfg['시즌 시작']).slice(0, 10), E = String(cfg['시즌 끝']).slice(0, 10);
  const today = raw.today, P = +cfg['출석 1회 점수'] || 10;
  const B = +(Object.entries(cfg).find(([k]) => k.startsWith('연속 보너스')) || [0, 0])[1];
  const TH = { RAW: +cfg['RAW 기준 점수'] || 250, CORE: +cfg['CORE 기준 점수'] || 150, CREW: +cfg['CREW 기준 점수'] || 60, ROOKIE: 0 };
  const MP = {}; Object.entries(cfg).forEach(([k, v]) => { if (k.startsWith('미션: ')) MP[k.slice(4).trim()] = +v || 0; });
  const tierOf = p => TIERS.find(t => p >= TH[t]);
  const head = raw.att[0] || [], dates = head.slice(2).map(String);
  const curW = monday(today), lastCut = addDays(curW, -1);
  const score = (row, name, cut) => {
    const days = dates.filter((d, i) => row[i + 2] === true && d >= S && d <= E && d <= cut);
    const weeks = [...new Set(days.map(monday))].sort();
    let bonus = 0, run = 0, prev = null;
    weeks.forEach(w => { run = prev && addDays(prev, 7) === w ? run + 1 : 1; if (run >= 2) bonus += B; prev = w; });
    const mis = raw.mis.slice(1).filter(r => String(r[1]).trim() === name && String(r[0]) >= S && String(r[0]) <= cut)
      .reduce((a, r) => a + (MP[String(r[2]).trim()] || 0), 0);
    return { n: days.length, weeks: new Set(weeks), pts: days.length * P + bonus + mis };
  };
  const list = raw.att.slice(1).filter(r => String(r[0]).trim()).map(r => {
    const name = String(r[0]).trim(), now = score(r, name, today), before = score(r, name, lastCut);
    const thisWeek = now.weeks.has(curW);
    let w = thisWeek ? curW : addDays(curW, -7), streak = 0;
    while (now.weeks.has(w)) { streak++; w = addDays(w, -7); }
    const tier = tierOf(now.pts), prevTier = tierOf(before.pts);
    return { name, cls: String(r[1] || ''), pts: now.pts, n: now.n, streak, thisWeek, tier,
      up: TIERS.indexOf(tier) < TIERS.indexOf(prevTier) ? prevTier : null };
  }).sort((a, b) => b.pts - a.pts || b.streak - a.streak || a.name.localeCompare(b.name, 'ko'));
  let rk = 0; list.forEach((s, i) => { rk = i && list[i - 1].pts === s.pts ? rk : i + 1; s.rank = rk; });
  const left = Math.ceil((D(E) - D(today)) / 864e5);
  const wNo = Math.floor((D(curW) - D(monday(S))) / 6048e5) + 1, wAll = Math.floor((D(monday(E)) - D(monday(S))) / 6048e5) + 1;
  return { list, cfg, S, E, today, left, wNo, wAll, TH, P, B, MP };
}

function render() {
  if (!DATA) return; const C = compute(DATA), L = C.list;
  const nm = String(C.cfg['시즌 이름'] || 'RAW SEASON').trim(), m = nm.match(/^(.*?)(\d+)$/);
  document.getElementById('sn').innerHTML = m ? `${esc(m[1])}<span>${m[2]}</span>` : esc(nm);
  document.getElementById('dd').textContent = C.today > C.E ? 'SEASON END' : C.today < C.S ? 'COMING SOON' : 'D-' + C.left;
  const f = s => s.slice(5).replace('-', '.');
  document.getElementById('per').textContent = `${f(C.S)} — ${f(C.E)}  ·  WEEK ${Math.max(1, Math.min(C.wNo, C.wAll))} / ${C.wAll}`;
  const pages = Math.max(1, Math.ceil(L.length / PER)); page %= pages;
  document.getElementById('pg').textContent = pages > 1 ? `${page + 1} / ${pages}` : '';
  document.getElementById('rows').innerHTML = L.slice(page * PER, page * PER + PER).map(s => `
    <div class="row fade ${s.rank <= 3 ? 'top' : ''}"><div class="rk">${String(s.rank).padStart(2, '0')}</div>
    <div class="nm">${esc(s.name)}<small>${esc(s.cls)}</small></div>
    <div class="tb t-${s.tier}">${s.tier}</div>
    <div class="st ${s.streak ? '' : 'off'}">🔥 ${s.streak}</div>
    <div class="pt">${s.pts}<small>P</small></div></div>`).join('');
  const sk = [...L].filter(s => s.streak).sort((a, b) => b.streak - a.streak || b.pts - a.pts).slice(0, 5);
  document.getElementById('streak').innerHTML = sk.map((s, i) => `<div class="fl"><b><em>${i + 1}</em>${esc(s.name)}</b><span>${s.streak}<small>주</small></span></div>`).join('') || '<div class="fl"><b>아직 기록 없음</b></div>';
  const cnt = Object.fromEntries(TIERS.map(t => [t, L.filter(s => s.tier === t).length])), mx = Math.max(1, ...Object.values(cnt));
  document.getElementById('tiers').innerHTML = TIERS.map(t => `<div class="tr"><div class="tb t-${t}" style="justify-self:start">${t}</div>
    <div class="bar"><i style="width:${cnt[t] / mx * 100}%;background:${TCOL[t]}"></i></div><b>${cnt[t]}</b></div>`).join('');
  document.getElementById('howto').innerHTML = `<b>출석 ${C.P}P</b> · <b>2주 연속부터 매주 +${C.B}P</b><br>` +
    Object.entries(C.MP).map(([k, v]) => `${esc(k)} +${v}`).join(' · ') +
    `<br>CREW ${C.TH.CREW} · CORE ${C.TH.CORE} · RAW ${C.TH.RAW}`;
  const ups = L.filter(s => s.up).map(s => `🎉 ${esc(s.name)} ${s.up} → ${s.tier}`);
  const risk = L.filter(s => !s.thisWeek && s.streak >= 2).sort((a, b) => b.streak - a.streak).map(s => `🔥 ${esc(s.name)} ${s.streak}주 연속 — 이번 주 오면 이어져요`);
  const top = L.slice(0, 1).map(s => `👑 1위 ${esc(s.name)} ${s.pts}P`);
  const items = [...top, ...ups, ...risk];
  document.getElementById('tt').innerHTML = (items.length ? items : ['이번 주도 RAW하게 🔥']).join('<span class="s">/</span>');
  const now = new Date(); document.getElementById('upd').textContent = `UPDATED ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
}

function load() {
  if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(s => { DATA = JSON.parse(s); render(); }).getData();
  else if (window.SAMPLE) { DATA = window.SAMPLE; render(); }
}
load(); setInterval(load, 60000);
setInterval(() => { page++; render(); }, ROT);
</script>
</body></html>
